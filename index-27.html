.feed{display:grid;gap:9px}.feeditem{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}.feeditem h3{margin:0;font-size:13px}.feeditem p{margin:5px 0;color:#51594f;line-height:1.5;font-size:12px}.feeditem footer{font-size:10px;color:var(--muted);margin-top:7px}
.calendar{padding:18px;background:#fff;border:1px solid var(--line);border-radius:17px}.calhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:9px;font-weight:800}.day{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#faf8f3;font-size:11px;position:relative}.day.present:after,.day.late:after,.day.absent:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;bottom:3px}.day.present:after{background:var(--green2)}.day.late:after{background:var(--yellow)}.day.absent:after{background:var(--red)}.day.today{outline:2px solid var(--green);font-weight:900}
.empty{text-align:center;padding:25px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:rgba(255,255,255,.45)}
.modalbg{position:fixed;inset:0;background:rgba(28,34,27,.4);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:15px}.modal{width:min(580px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.mh h2{margin:0;font-size:19px}.x{width:32px;height:32px;border-radius:50%;border:0;background:#eee8dd;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.tagbtn{padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:11px;font-weight:800;cursor:pointer}.tagbtn.on{background:var(--soft);color:var(--green);border-color:#bbc8ad}
.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:#273024;color:white;padding:11px 13px;border-radius:12px;box-shadow:0 14px 35px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);transition:.2s;font-size:12px;max-width:350px}.toast.show{opacity:1;transform:translateY(0)}
.mobiletop,.mobilenav{display:none}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.loginbox{grid-template-columns:1fr}.hero h1{margin-top:30px}}
@media(max-width:720px){.layout{display:block}.side{display:none}.main{padding:76px 13px 88px}.mobiletop{position:fixed;z-index:25;top:0;left:0;right:0;height:62px;display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:rgba(248,243,234,.94);backdrop-filter:blur(13px);border-bottom:1px solid var(--line)}.mobiletop .brand strong{font-size:14px}.mobiletop .brand small{display:none}.mobiletop .logo{width:35px;height:35px;font-size:21px}.mobilenav{position:fixed;z-index:25;bottom:7px;left:7px;right:7px;display:flex;overflow-x:auto;gap:3px;padding:6px;background:rgba(255,253,248,.96);backdrop-filter:blur(13px);border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 35px rgba(0,0,0,.13)}.mobilenav button{min-width:72px;border:0;background:transparent;border-radius:11px;padding:8px 6px;font-size:9px;font-weight:800;color:var(--muted)}.mobilenav button.on{background:var(--soft);color:var(--green)}.top{display:block}.topright{justify-content:flex-start;margin-top:10px}.g4,.g3,.g2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.login{padding:9px}.hero,.loginform{padding:25px}.hero h1{font-size:43px}.demobtns{grid-template-columns:1fr}.attrow{flex-wrap:wrap;align-items:flex-start}.attactions{margin-left:47px;width:calc(100% - 47px);justify-content:flex-start}}
@media print{.side,.mobilenav,.mobiletop,.topright,.noprint{display:none!important}.layout{display:block}.main{padding:0}.card{box-shadow:none}}
</style>

<script>
(()=>{
const SUPABASE_URL='https://pqzgbhlkodsslykombsv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_d9Rf6xNSups9x8Fyz4W-Og_t0Oy4m1Y';
const SESSION='lc_supabase_session_v2';
const subjectsDefault=[
  ['circle','Круг','⭕'],['rus','Русский язык','📖'],['logic','Логика','🧠'],['math','Математика','➗'],['reading','Чтение','📚'],

  ['pe','Физическая культура','🏃'],['art','ИЗО','🎨'],['drawing','Рисунок','✏️'],['music','Музыка','🎵'],['creative','Творчество','🎭'],
  ['technology','Технология','🛠️'],['theatre','Театр','🎬'],['chess','Шахматы','♟️'],['football','Футбол','⚽'],['swimming','Плавание','🏊'],
  ['sculpture','Скульптура','🗿'],['woodwork','Столярная','🪵'],['flute','Свирель','🎶'],['english_craft','English Craft','🧵'],
  ['extended','Продлёнка','🧩'],['breakfast','Завтрак','🍽️'],['break','Перемена','☕'],['lunch','Обед','🥣']
].map(x=>({code:x[0],name:x[1],icon:x[2]}));
const tags=['Мышление','Коммуникация','Самостоятельность','Инициатива','Творчество','Внимательность','Командная работа'];
const days=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
let db={school:null,profiles:[],classes:[],subjects:[],children:[],parentLinks:[],schedule:[],substitutions:[],observations:[],attendance:[],lessonRecords:[],feedbackReports:[],feedbackSections:[]};
let session=null,route=null,lessonOpen=null,sb=null,authSb=null;
function iso(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d=new Date()){let x=new Date(d),k=x.getDay()||7;x.setHours(12,0,0,0);x.setDate(x.getDate()-k+1);return x}
function fmt(d,o={day:'numeric',month:'long'}){return new Intl.DateTimeFormat('ru-RU',o).format(new Date(d))}
function week(){let s=monday(),e=add(s,4);return fmt(s,{day:'numeric'})+'–'+fmt(e,{day:'numeric',month:'long'})}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function initials(s=''){return s.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function sub(i){return db.subjects.find(x=>x.id===i)||{name:'Предмет',icon:'📘'}}
function subByCode(code){return db.subjects.find(x=>x.code===code)}
function cls(i){return db.classes.find(x=>x.id===i)}
function kid(i){return db.children.find(x=>x.id===i)}
function prof(i){return db.profiles.find(x=>x.id===i)}
function user(){return session?prof(session.userId):null}
function toast(t){let x=document.getElementById('toast');if(!x)return;x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),2800)}
function brand(){return '<div class="brand"><div class="logo">🌱</div><div><strong>Little Clan Diary</strong><small>дневник роста ребёнка</small></div></div>'}
const roleName={admin:'Администратор',teacher:'Педагог',parent:'Родитель'};
const navs={
 admin:[['dashboard','⌂ Дашборд'],['classes','▦ Классы'],['children','◉ Дети'],['teachers','♙ Педагоги'],['parents','♧ Родители'],['users','♙ Пользователи'],['schedule','◷ Расписание'],['reports','⇩ Итоги / PDF']],
 teacher:[['today','☀ Сегодня'],['notes','✎ Наблюдения'],['feedback','▣ Итоги'],['schedule','◷ Расписание']],
 parent:[['home','⌂ Главная'],['week','▤ Неделя'],['calendar','◫ Календарь'],['schedule','◷ Расписание']]
};
function def(r){return r==='admin'?'dashboard':r==='teacher'?'today':'home'}
function nav(role){return navs[role].map(n=>`<button class="${route===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}
function top(title,subt,extra=''){return `<div class="top"><div><h1>${title}</h1><p>${subt}</p></div><div class="topright"><span class="badge">${roleName[user().role]}</span><span class="cloud">☁ Данные в Supabase</span>${extra}</div></div>`}
async function query(table,columns='*'){let {data,error}=await sb.from(table).select(columns);if(error)throw error;return data||[]}
async function loadDb(){
 const authId=session?.userId;if(!authId)throw new Error('Сессия пользователя не найдена');
 // Сначала загружаем профиль текущего Auth-пользователя. После входа db.profiles ещё пуст,
 // поэтому нельзя определять schoolId через user() до первого запроса profiles.
 const {data:me,error:meError}=await sb.from('profiles').select('id,school_id,role,full_name,active').eq('id',authId).maybeSingle();
 if(meError)throw meError;
 if(!me)throw new Error('Профиль пользователя не найден в public.profiles');
 if(!me.school_id)throw new Error('У пользователя не привязана школа');
 db.profiles=[{id:me.id,schoolId:me.school_id,role:me.role,name:me.full_name,active:me.active}];
 const schoolId=me.school_id;
 const [schools,profiles,classes,subjects,children,parentLinks,schedule,substitutions,observations,attendance,lessonRecords,feedbackReports,feedbackSections]=await Promise.all([
  query('schools','id,name,city'),query('profiles','id,school_id,role,full_name,active'),query('classes','id,school_id,name,school_year,active'),query('subjects','id,school_id,code,name,icon,active'),
  query('children','id,school_id,class_id,first_name,last_name,birth_date,active'),query('child_parents','child_id,parent_id,relation_label'),
  query('schedule','id,school_id,class_id,subject_id,teacher_id,weekday,starts_at,ends_at,room,active'),
  query('lesson_substitutions','id,school_id,schedule_id,substitute_teacher_id,lesson_date,note,created_by,created_at,updated_at'),
  query('observations','id,school_id,child_id,subject_id,teacher_id,schedule_id,observed_on,note,tags,created_at,updated_at'),
  query('attendance','id,school_id,child_id,schedule_id,lesson_date,status,marked_by,updated_at'),
  query('lesson_records','id,school_id,schedule_id,lesson_date,teacher_id,topic,note,created_at,updated_at'),
  query('feedback_reports','id,school_id,child_id,period_start,period_end,teacher_id,overall_comment,status,published_at,created_at,updated_at'),
  query('feedback_sections','id,school_id,feedback_id,subject_id,studied,strengths,attention,next_step,created_at,updated_at')
 ]);
 db.school=schools.find(s=>s.id===schoolId)||schools[0]||null;
 db.profiles=profiles.map(p=>({id:p.id,schoolId:p.school_id,role:p.role,name:p.full_name,active:p.active}));
 db.classes=classes.map(c=>({id:c.id,schoolId:c.school_id,name:c.name,year:c.school_year,active:c.active}));
 db.subjects=subjects.map(s=>({id:s.id,schoolId:s.school_id,code:s.code,name:s.name,icon:s.icon||'📘',active:s.active}));
 db.children=children.map(k=>({id:k.id,schoolId:k.school_id,classId:k.class_id,first:k.first_name,last:k.last_name,name:[k.last_name,k.first_name].filter(Boolean).join(' '),birthDate:k.birth_date,active:k.active}));
 db.parentLinks=parentLinks;
 db.schedule=schedule.map(l=>({id:l.id,schoolId:l.school_id,classId:l.class_id,subjectId:l.subject_id,teacherId:l.teacher_id,weekday:Number(l.weekday),start:String(l.starts_at).slice(0,5),end:String(l.ends_at).slice(0,5),room:l.room,active:l.active}));
 db.substitutions=substitutions.map(x=>({id:x.id,schoolId:x.school_id,scheduleId:x.schedule_id,substituteTeacherId:x.substitute_teacher_id,date:x.lesson_date,note:x.note||'',createdBy:x.created_by,createdAt:x.created_at,updatedAt:x.updated_at}));
 db.observations=observations.map(o=>({id:o.id,schoolId:o.school_id,childId:o.child_id,subjectId:o.subject_id,teacherId:o.teacher_id,scheduleId:o.schedule_id||null,date:o.observed_on,tags:o.tags||[],text:o.note,createdAt:o.created_at}));
 db.attendance=attendance.map(a=>({id:a.id,schoolId:a.school_id,childId:a.child_id,scheduleId:a.schedule_id,date:a.lesson_date,status:a.status,markedBy:a.marked_by}));
 db.lessonRecords=lessonRecords.map(x=>({id:x.id,schoolId:x.school_id,scheduleId:x.schedule_id,date:x.lesson_date,teacherId:x.teacher_id,topic:x.topic||'',note:x.note||'',createdAt:x.created_at,updatedAt:x.updated_at}));
 db.feedbackReports=feedbackReports.map(x=>({id:x.id,schoolId:x.school_id,childId:x.child_id,start:x.period_start,end:x.period_end,teacherId:x.teacher_id,overall:x.overall_comment||'',status:x.status,publishedAt:x.published_at,createdAt:x.created_at,updatedAt:x.updated_at}));
 db.feedbackSections=feedbackSections.map(x=>({id:x.id,schoolId:x.school_id,feedbackId:x.feedback_id,subjectId:x.subject_id,studied:x.studied||'',strengths:x.strengths||'',attention:x.attention||'',nextStep:x.next_step||''}));
 if(user().role==='admin')await ensureSubjects();
}
async function ensureSubjects(){
 const schoolId=user().schoolId;

function metric(a,b,c){return `<div class="card metric"><small>${a}</small><b>${b}</b><span>${c}</span></div>`}
function subFor(scheduleId,date){return db.substitutions.find(x=>x.scheduleId===scheduleId&&x.date===date)}
function effectiveTeacherId(scheduleId,date=iso()){let l=db.schedule.find(x=>x.id===scheduleId),r=subFor(scheduleId,date);return r?.substituteTeacherId||l?.teacherId}
function effectiveLessons(date=iso(),teacherId=null){let wd=new Date(date+'T12:00:00').getDay();return db.schedule.filter(x=>x.active&&x.weekday===wd&&(!teacherId||effectiveTeacherId(x.id,date)===teacherId)).sort((a,b)=>a.start.localeCompare(b.start))}
function lessonMinutes(l){let [sh,sm]=String(l.start).split(':').map(Number),[eh,em]=String(l.end).split(':').map(Number);return Math.max(0,(eh*60+em)-(sh*60+sm))}
function workedMinutes(teacherId,start=iso(monday()),end=iso(add(monday(),4))){let mins=0,seen=new Set();for(let i=0;i<5;i++){let d=iso(add(monday(),i));if(d<start||d>end)continue;for(const l of db.schedule.filter(x=>x.active)){if(effectiveTeacherId(l.id,d)!==teacherId)continue;let done=db.attendance.some(a=>a.scheduleId===l.id&&a.date===d)||db.lessonRecords.some(x=>x.scheduleId===l.id&&x.date===d);if(done&&!seen.has(l.id+'|'+d)){mins+=lessonMinutes(l);seen.add(l.id+'|'+d)}}}return mins}
function fmtHours(mins){let h=Math.floor(mins/60),m=mins%60;return m?`${h} ч ${m} мин`:`${h} ч`}
function lessonRecord(scheduleId,date=iso()){return db.lessonRecords.find(x=>x.scheduleId===scheduleId&&x.date===date)}
function lessonRow(l,opts={}){let rec=lessonRecord(l.id);return `<div class="row"><span class="time">${l.start}</span><span class="ico">${sub(l.subjectId).icon}</span><div class="rowmain"><strong>${esc(cls(l.classId)?.name||'')} · ${esc(sub(l.subjectId).name)}</strong><small>${esc(prof(l.teacherId)?.name||'Педагог')} · ${l.start}–${l.end}${rec?.topic?' · '+esc(rec.topic):''}</small></div>${opts.edit?`<button class="btn soft" onclick="scheduleModal('${l.id}')">Изменить</button>`:''}</div>`}
function obsRow(o){return `<div class="row"><span class="avatar">${initials(kid(o.childId)?.name)}</span><div class="rowmain"><strong>${esc(kid(o.childId)?.name||'')} · ${esc(sub(o.subjectId).name)}</strong><small>${esc(o.text)}</small><small>${fmt(o.date,{day:'numeric',month:'short'})} · ${esc(prof(o.teacherId)?.name||'')}</small></div></div>`}
function adDash(){let wd=new Date().getDay(),ls=db.schedule.filter(x=>x.weekday===wd&&x.active).sort((a,b)=>a.start.localeCompare(b.start)),s=iso(monday()),e=iso(add(monday(),4)),obs=db.observations.filter(o=>o.date>=s&&o.date<=e);return top('Дашборд','Вся школа в одном экране.','<button class="btn primary" onclick="scheduleModal()">+ Занятие</button>')+`<div class="grid g4">${metric('Классы',db.classes.filter(x=>x.active).length,'активные классы')}${metric('Дети',db.children.filter(x=>x.active).length,'зачислены')}${metric('Педагоги',db.profiles.filter(x=>x.role==='teacher'&&x.active).length,'с отдельным входом')}${metric('Наблюдения',obs.length,'за эту неделю')}</div><section class="section grid g2"><div class="card"><div class="sh"><div><h2>Занятия сегодня</h2><p>${days[wd]}</p></div></div>${ls.length?'<div class="list">'+ls.map(l=>lessonRow(l)).join('')+'</div>':'<div class="empty">Сегодня занятий нет.</div>'}</div><div class="card"><div class="sh"><div><h2>Последние наблюдения</h2><p>Что замечают педагоги</p></div></div><div class="list">${db.observations.slice().reverse().slice(0,5).map(obsRow).join('')||'<div class="empty">Пока нет наблюдений.</div>'}</div></div></section>`}

function adTeachers(){let ts=db.profiles.filter(x=>x.role==='teacher');return top('Педагоги','Здесь можно создать логин и пароль педагога.','<button class="btn primary" onclick="teacherModal()">+ Педагог</button>')+`<div class="card" style="margin-bottom:14px"><p style="color:var(--muted);line-height:1.6;margin:0">Ты сама задаёшь педагогу <b>логин и пароль</b>. Email педагога не нужен.<br><small style="opacity:.65">Версия педагогов 8.1</small></p></div><div class="grid g3">${ts.map(t=>`<div class="card"><div style="display:flex;gap:11px;align-items:center"><span class="avatar">${initials(t.name)}</span><div style="min-width:0"><b>${esc(t.name)}</b><div style="font-size:11px;color:var(--muted);margin-top:3px">${t.active?'Активный педагог':'Архив'}</div></div></div><div class="chips" style="margin-top:13px"><span class="chip green">${db.schedule.filter(s=>s.teacherId===t.id&&s.active).length} занятий/нед.</span><span class="chip orange">${fmtHours(workedMinutes(t.id))} отработано</span><span class="chip">${db.observations.filter(o=>o.teacherId===t.id).length} заметок</span></div><div class="actions" style="justify-content:flex-start;margin-top:13px"><button class="btn soft" onclick="teacherModal('${t.id}')">Изменить</button>${t.active?`<button class="btn ghost" onclick="archiveTeacher('${t.id}')">В архив</button>`:`<button class="btn soft" onclick="restoreTeacher('${t.id}')">Вернуть</button>`}</div></div>`).join('')||'<div class="empty">Пока нет педагогов.</div>'}</div>`}

function tToday(){let u=user(),wd=new Date().getDay(),ls=effectiveLessons(iso(),u.id);return top('Сегодня',days[wd]+', '+fmt(new Date(),{day:'numeric',month:'long'}))+`${ls.length?'<div class="grid g2">'+ls.map(l=>{let rec=lessonRecord(l.id);return `<div class="card"><div class="row" style="border:0;padding:0"><span class="ico">${sub(l.subjectId).icon}</span><div class="rowmain"><strong>${esc(cls(l.classId)?.name||'')} · ${esc(sub(l.subjectId).name)}</strong><small>${l.start}–${l.end}</small></div></div><div class="chips" style="margin-top:13px"><span class="chip green">${db.children.filter(k=>k.classId===l.classId&&k.active).length} детей</span>${rec?.topic?`<span class="chip">Тема: ${esc(rec.topic)}</span>`:''}</div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" onclick="openLesson('${l.id}')">Посещаемость</button><button class="btn ghost" onclick="lessonTopicModal('${l.id}')">${rec?'Изменить тему':'Тема урока'}</button><button class="btn ghost" onclick="noteModal('${l.id}')">+ Заметка</button></div></div>`}).join('')+'</div>':'<div class="empty">Сегодня у вас нет занятий.</div>'}${lessonOpen?attendanceBox(lessonOpen):''}`}
