<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E2D22">
<title>Little Clan Diary — Семейная хроника роста</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE6;--bg-top:#FAF7F2;--card:#FFFDF9;--ink:#1C221C;--muted:#6E6A63;
  --green:#1E3124;--green2:#3A523F;--soft:#E9EFE8;--line:#DFD5C5;
  --gold:#C5A572;--goldSoft:rgba(197,165,114,.28);
  --orange:#B85D3B;--orangeSoft:#F6E6DE;--yellow:#B88928;--yellowSoft:#F9F0DA;
  --red:#9E4740;--redSoft:#F4E1DF;
  --shadow:0 18px 44px -12px rgba(28,34,28,.08);
  --shadow-card:0 10px 28px -8px rgba(30,25,20,.05);
  --font-serif:'Cormorant Garamond',Georgia,serif;
  --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg-top),var(--bg));color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.lux-svg{width:19px;height:19px;stroke:var(--green);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:0 0 auto}
.ico .lux-svg{width:20px;height:20px;vertical-align:0}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#243829,#162419);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);box-shadow:0 6px 18px rgba(22,36,25,.16);flex:0 0 auto}
.logo svg{width:22px;height:22px;stroke:var(--gold);stroke-width:1.5;fill:none}
.brand strong{display:block;font-family:var(--font-serif);font-size:21px;font-weight:700;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-top:2px}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 12% 18%,rgba(197,165,114,.16) 0,transparent 38%)}
.loginbox{width:min(980px,100%);display:grid;grid-template-columns:1.1fr .9fr;border:1px solid var(--goldSoft);border-radius:28px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.hero{padding:44px;background:linear-gradient(145deg,#FAF5EC,#EFECE4);border-right:1px solid var(--line)}
.hero h1{font-family:var(--font-serif);font-size:clamp(40px,5.5vw,64px);font-weight:600;line-height:.98;margin:36px 0 18px}
.hero h1 span{color:var(--green);font-style:italic}
.hero p{font-size:16px;color:var(--muted);line-height:1.65}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.pill{padding:8px 13px;border:1px solid rgba(197,165,114,.38);background:#FFFDF9;border-radius:99px;font-size:11px;font-weight:600}
.loginform{padding:42px;display:flex;flex-direction:column;justify-content:center}
.loginform h2{margin:0 0 6px;font-family:var(--font-serif);font-size:32px;font-weight:600}
.loginform>p{margin:0 0 22px;color:var(--muted);font-size:14px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#FFFDF9;color:var(--ink);outline:none;font-size:14px}
textarea{min-height:104px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(197,165,114,.16)}
.btn{border:0;border-radius:99px;padding:10px 16px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.primary{background:linear-gradient(145deg,#243829,#18271C);color:#FAF7F2;border:1px solid rgba(197,165,114,.45)}
.soft{background:var(--soft);color:var(--green);border:1px solid rgba(58,82,63,.15)}
.ghost{background:#FFFDF9;border:1px solid var(--line);color:var(--ink)}
.wide{width:100%}
.demo{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.demo small{color:var(--muted);font-size:12px}
.layout{min-height:100vh;display:grid;grid-template-columns:255px 1fr}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;background:linear-gradient(180deg,#1A281E,#141F17);color:#FAF7F2;display:flex;flex-direction:column;gap:20px;border-right:1px solid rgba(197,165,114,.25)}
.side .brand strong{color:#FAF7F2}.side .brand small{color:var(--gold)}
.nav{display:grid;gap:5px}
.nav button{border:1px solid transparent;background:transparent;color:rgba(250,247,242,.7);padding:11px 14px;border-radius:13px;text-align:left;font-weight:500;font-size:13.5px;cursor:pointer}
.nav button.on{background:rgba(197,165,114,.16);color:#FFFDF9;border-color:rgba(197,165,114,.35);font-weight:600}
.spacer{flex:1}
.me{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(197,165,114,.2)}
.me strong{font-family:var(--font-serif);font-size:17px;color:#FFFDF9}
.me small{display:block;color:var(--gold);margin-top:3px;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.logout{width:100%;margin-top:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
.main{min-width:0;padding:32px clamp(16px,3vw,42px) 60px;max-width:1340px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:22px;padding-bottom:15px;border-bottom:1px solid rgba(197,165,114,.28);flex-wrap:wrap}
.top h1{margin:0 0 5px;font-family:var(--font-serif);font-size:clamp(30px,3.5vw,44px);font-weight:600;line-height:1.05}
.top p{margin:0;color:var(--muted);font-size:13.5px}
.topright{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{padding:7px 12px;border-radius:99px;background:#F3ECE0;border:1px solid var(--gold);color:var(--ink);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.cloud{padding:7px 11px;border-radius:99px;background:#FFFDF9;border:1px solid var(--line);color:var(--muted);font-size:11px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid rgba(197,165,114,.28);border-radius:22px;padding:20px;box-shadow:var(--shadow-card)}
.metric{background:linear-gradient(160deg,#FFFDF9,#FAF5EC);outline:1px solid rgba(197,165,114,.15);outline-offset:-5px}
.metric small{color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.metric b{display:block;font-family:var(--font-serif);font-size:44px;font-weight:600;line-height:1;margin-top:10px;color:var(--green)}
.metric span{display:block;color:var(--muted);margin-top:6px;font-style:italic;font-family:var(--font-serif);font-size:15px}
.section{margin-top:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.sh h2,.sh h3{margin:0;font-family:var(--font-serif);font-size:23px;font-weight:600}
.sh p{margin:3px 0 0;color:var(--muted);font-size:12px}
.list{display:grid;gap:9px}
.row{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#FFFDF9}
.rowmain{flex:1;min-width:0}
.rowmain strong{display:block;font-size:13.5px;font-weight:600}
.rowmain small{display:block;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.4}
.time{padding:6px 10px;border-radius:9px;background:#F6F1E7;border:1px solid rgba(197,165,114,.35);color:var(--green);font-family:var(--font-serif);font-weight:700;font-size:13.5px}
.ico{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#F6EFE2;border:1px solid rgba(197,165,114,.35);font-size:17px;flex:0 0 auto}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#243829,#17251B);color:#F6EFE2;border:1.5px solid var(--gold);font-family:var(--font-serif);font-size:15px;font-weight:600;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:5px 10px;border-radius:99px;background:#F2ECE1;border:1px solid rgba(197,165,114,.24);font-size:11px;font-weight:600}
.green{background:var(--soft);color:var(--green)}.yellow{background:var(--yellowSoft);color:#7D5B14}.red{background:var(--redSoft);color:var(--red)}.orange{background:var(--orangeSoft);color:var(--orange)}
.box{background:#FAF6EE;border:1px solid rgba(197,165,114,.35);border-radius:16px;padding:16px 18px;margin-top:12px}
.box h3{margin:0 0 8px;font-family:var(--font-serif);font-size:20px;font-weight:600;color:var(--green);border-bottom:1px solid rgba(197,165,114,.2);padding-bottom:6px}
.box p{margin:7px 0;font-size:13px;line-height:1.6}
.table{overflow:auto;border:1px solid rgba(197,165,114,.28);border-radius:16px;background:#FFFDF9}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 14px;border-bottom:1px solid #EFE8DC;text-align:left;font-size:12.5px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#F8F3EA;font-weight:700}
tr:last-child td{border-bottom:0}
.attrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EFE8DC}
.attrow:last-child{border-bottom:0}
.attactions{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.att{padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:#FFFDF9;font-size:11px;font-weight:600;cursor:pointer}
.att.on.present{background:var(--soft);color:var(--green)}.att.on.late{background:var(--yellowSoft);color:#7D5B14}.att.on.absent{background:var(--redSoft);color:var(--red)}
.herochild{display:flex;align-items:center;gap:16px;padding:22px;border:1px solid rgba(197,165,114,.4);border-radius:24px;background:linear-gradient(135deg,#F6F1E6,#EAEFE8)}
.herochild .avatar{width:56px;height:56px;font-size:21px}
.herochild h2{margin:0;font-family:var(--font-serif);font-size:28px}.herochild p{margin:4px 0 0;color:var(--muted);font-size:13px}
.feed{display:grid;gap:10px}
.feeditem{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:16px;border:1px solid rgba(197,165,114,.3);border-radius:18px;background:#FFFDF9}
.feeditem h3{margin:0;font-family:var(--font-serif);font-size:19px}.feeditem p{margin:6px 0 8px;line-height:1.6;font-size:13px}.feeditem footer{color:var(--muted);margin-top:8px;font-style:italic;font-family:var(--font-serif);font-size:13px}
.calendar{padding:20px;background:var(--card);border:1px solid rgba(197,165,114,.3);border-radius:20px}
.calhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
.calhead b{font-family:var(--font-serif);font-size:22px;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;color:var(--muted);font-size:10px;font-weight:700}
.day{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#F8F4EC;font-family:var(--font-serif);font-size:14px;font-weight:600;position:relative}
.day.present:after,.day.late:after,.day.absent:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;bottom:3px}
.day.present:after{background:var(--green2)}.day.late:after{background:var(--yellow)}.day.absent:after{background:var(--red)}
.day.today{background:var(--green);color:#FFFDF9;border:1px solid var(--gold)}
.empty{text-align:center;padding:26px;color:var(--muted);border:1px dashed rgba(197,165,114,.45);border-radius:16px;background:rgba(255,253,249,.6);font-family:var(--font-serif);font-style:italic;font-size:17px}
.modalbg{position:fixed;inset:0;background:rgba(20,26,20,.55);z-index:50;display:grid;place-items:center;padding:14px}
.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--gold);border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-family:var(--font-serif);font-size:25px}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#F7F2E8;cursor:pointer;font-size:18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.tagbtn{padding:7px 12px;border:1px solid var(--line);background:#FFFDF9;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer}
.tagbtn.on{background:var(--green);color:#FFFDF9;border-color:var(--gold)}
.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:#1E2D22;color:#FAF7F2;border:1px solid var(--gold);padding:12px 16px;border-radius:14px;opacity:0;transform:translateY(10px);transition:.2s;font-size:12px;max-width:340px;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* Верхнее выпадающее меню и фильтр параллелей 1-4 */
.mobilenav{display:none!important}
.mobiletop{display:none}
.lux-menu-wrap{display:flex;align-items:center;gap:8px;background:#FAF5EC;border:1px solid var(--gold);border-radius:14px;padding:4px 10px}
.lux-menu-wrap span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.lux-top-select{border:0!important;background:transparent!important;padding:6px 4px!important;font-weight:700;font-size:13.5px!important;color:var(--green)!important;cursor:pointer;width:100%;box-shadow:none!important}
.lux-filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:16px;background:linear-gradient(145deg,#FFFDF9,#F6F0E4);border:1px solid rgba(197,165,114,.38);border-radius:18px}
.lux-grade-pills{display:flex;flex-wrap:wrap;gap:6px}
.lux-gpill{border:1px solid var(--line);background:#FFFDF9;color:var(--ink);padding:7px 13px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.lux-gpill.on{background:var(--green);color:#FAF7F2;border-color:var(--gold);box-shadow:0 4px 10px rgba(30,49,36,.18)}
.lux-search{max-width:240px;padding:8px 12px!important;border-radius:99px!important;font-size:12.5px!important}
.lux-kids-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.lux-kid-card{background:linear-gradient(180deg,#FFFFFF,#FCF9F4);border:1px solid rgba(197,165,114,.32);border-radius:18px;padding:15px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 14px rgba(30,25,20,.03)}
.lux-kid-head{display:flex;align-items:center;gap:11px}
.lux-kid-cls{margin-left:auto;padding:5px 11px;border-radius:99px;background:#F3ECE0;border:1px solid var(--gold);color:var(--green);font-family:var(--font-serif);font-weight:700;font-size:14px}
.lux-kid-actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px solid #EFE8DC}
.lux-grade-divider{grid-column:1/-1;font-family:var(--font-serif);font-size:22px;font-weight:700;color:var(--green);margin:10px 0 2px;padding-bottom:5px;border-bottom:1px solid rgba(197,165,114,.35)}

@media(max-width:980px){
  .layout{display:block}.side{display:none}
  .main{padding:124px 14px 45px}
  .mobiletop{position:fixed;z-index:35;top:0;left:0;right:0;display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:#FAF7F2;border-bottom:1px solid rgba(197,165,114,.38);box-shadow:0 6px 20px rgba(28,34,28,.07)}
  .mobiletop-row1{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
  .mobiletop .brand strong{font-size:18px}.mobiletop .brand small{display:none}.mobiletop .logo{width:35px;height:35px}
  .g4,.g3{grid-template-columns:repeat(2,1fr)}.loginbox{grid-template-columns:1fr}.hero{border-right:0;border-bottom:1px solid var(--line)}
}
@media(max-width:720px){
  .g4,.g3,.g2,.formgrid{grid-template-columns:1fr}
  .lux-search{max-width:100%;width:100%}
  .attrow{flex-wrap:wrap}.attactions{margin-left:50px;width:calc(100% - 50px);justify-content:flex-start}
}
@media print{.side,.mobilenav,.mobiletop,.topright,.lux-filter-bar,.noprint{display:none!important}.layout{display:block}.main{padding:0}.card{box-shadow:none}}
</style>
<script>
(()=>{
window._lcGrade='all';
window._lcSearch='';
function extractGrade(s){
  const t=String(s||'').trim();
  const m=t.match(/^([1-4])(?![0-9])|([1-4])\s*кл/i);
  return m?(m[1]||m[2]):'other';
}
function buildTopDropdown(){
  const navBtns=[...document.querySelectorAll('.mobilenav button, .side .nav button')];
  if(!navBtns.length)return;
  const seen=new Set(),items=[];
  navBtns.forEach(b=>{
    const m=(b.getAttribute('onclick')||'').match(/go\(['"]([^'"]+)['"]\)/);
    if(m&&!seen.has(m[1])){seen.add(m[1]);items.push({route:m[1],label:b.textContent.trim(),on:b.classList.contains('on')})}
  });
  if(!items.length)return;
  const opts=items.map(i=>`<option value="${i.route}" ${i.on?'selected':''}>${i.label}</option>`).join('');
  const mtop=document.querySelector('.mobiletop');
  if(mtop&&!mtop.querySelector('.lux-top-select')){
    const children=[...mtop.children];
    const r1=document.createElement('div');r1.className='mobiletop-row1';
    children.forEach(c=>r1.appendChild(c));
    const r2=document.createElement('div');r2.className='lux-menu-wrap';
    r2.innerHTML=`<span>Меню:</span><select class="lux-top-select" onchange="window.go(this.value)">${opts}</select>`;
    mtop.appendChild(r1);mtop.appendChild(r2);
  }
  const tr=document.querySelector('.top .topright');
  if(tr&&!tr.querySelector('.lux-top-select')){
    const wrap=document.createElement('div');wrap.className='lux-menu-wrap';
    wrap.innerHTML=`<span>Раздел:</span><select class="lux-top-select" onchange="window.go(this.value)">${opts}</select>`;
    tr.prepend(wrap);
  }
}
function makeFilterBar(onUpdate,withSearch=true){
  const bar=document.createElement('div');bar.className='lux-filter-bar';
  const grades=[['all','Все параллели'],['1','1 класс'],['2','2 класс'],['3','3 класс'],['4','4 класс']];
  bar.innerHTML=`<div class="lux-grade-pills">${grades.map(([g,l])=>`<button type="button" class="lux-gpill ${window._lcGrade===g?'on':''}" data-g="${g}">${l}</button>`).join('')}</div>${withSearch?`<input type="search" class="lux-search" placeholder="Поиск по имени или классу..." value="${window._lcSearch}">`:''}`;
  bar.querySelectorAll('.lux-gpill').forEach(btn=>{
    btn.onclick=()=>{
      window._lcGrade=btn.dataset.g;
      bar.querySelectorAll('.lux-gpill').forEach(b=>b.classList.toggle('on',b.dataset.g===window._lcGrade));
      onUpdate();
    };
  });
  const inp=bar.querySelector('.lux-search');
  if(inp)inp.oninput=e=>{window._lcSearch=e.target.value.trim().toLowerCase();onUpdate()};
  return bar;
}
function upgradeTablesAndLists(){
  const h1=document.querySelector('.main .top h1')?.textContent.trim()||'';
  /* 1. Раздел КЛАССЫ */
  if(h1==='Классы'){
    const grid=document.querySelector('.main > .grid.g3');
    if(!grid||grid.dataset.upgraded)return;
    grid.dataset.upgraded='1';
    const cards=[...grid.querySelectorAll(':scope > .card')];
    cards.forEach(c=>{
      const clsName=c.querySelector('.sh h2')?.textContent.trim()||'';
      c.dataset.grade=extractGrade(clsName);
      c.dataset.cls=clsName.toLowerCase();
    });
    cards.sort((a,b)=>(a.dataset.grade.localeCompare(b.dataset.grade))||(a.dataset.cls.localeCompare(b.dataset.cls)));
    cards.forEach(c=>grid.appendChild(c));
    const apply=()=>{
      const q=window._lcSearch;
      cards.forEach(c=>{
        const okG=window._lcGrade==='all'||c.dataset.grade===window._lcGrade;
        const okS=!q||c.textContent.toLowerCase().includes(q);
        c.style.display=(okG&&okS)?'':'none';
      });
    };
    grid.before(makeFilterBar(apply,true));
    apply();
  }

  if(h1==='Дети'||h1==='Итоги / PDF'){
    const tables=[...document.querySelectorAll('.main .card .table')];
    if(!tables.length||tables[0].dataset.upgraded)return;
    const allGrids=[];
    tables.forEach(tWrap=>{
      tWrap.dataset.upgraded='1';
      const rows=[...tWrap.querySelectorAll('tbody tr')];
      const grid=document.createElement('div');grid.className='lux-kids-grid';
      const items=[];
      rows.forEach(tr=>{
        const tds=tr.querySelectorAll('td');
        if(tds.length<4)return;
        const nameHtml=tds[0].innerHTML,clsText=tds[1].textContent.trim(),infoHtml=tds[2].innerHTML,btnsHtml=tds[3].innerHTML;

        card.dataset.grade=grade;card.dataset.cls=clsText;card.dataset.search=(tds[0].textContent+' '+clsText).toLowerCase();
        const initials=(tds[0].querySelector('b')?.textContent||'Р').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
        card.innerHTML=`<div class="lux-kid-head"><span class="avatar">${initials}</span><div class="rowmain">${nameHtml}</div><span class="lux-kid-cls">${clsText||'—'}</span></div><div style="font-size:12px">${infoHtml}</div><div class="lux-kid-actions">${btnsHtml}</div>`;
        items.push(card);
      });
      if(!items.length)return;
      items.sort((a,b)=>(a.dataset.grade.localeCompare(b.dataset.grade))||(a.dataset.cls.localeCompare(b.dataset.cls))||(a.dataset.search.localeCompare(b.dataset.search)));
      tWrap.replaceWith(grid);
      allGrids.push({grid,items});
    });
    if(!allGrids.length)return;
    const apply=()=>{
      const q=window._lcSearch;
      allGrids.forEach(({grid,items})=>{
        grid.innerHTML='';
        let lastG=null;
        items.forEach(c=>{
          const okG=window._lcGrade==='all'||c.dataset.grade===window._lcGrade;
          const okS=!q||c.dataset.search.includes(q);
          if(okG&&okS){
            if(window._lcGrade==='all'&&c.dataset.grade!==lastG){
              lastG=c.dataset.grade;
              const div=document.createElement('div');div.className='lux-grade-divider';
              div.textContent=lastG==='other'?'Другие классы':`${lastG} параллель (${lastG} класс)`;
              grid.appendChild(div);
            }
            grid.appendChild(c);
          }
        });
        if(!grid.children.length)grid.innerHTML='<div class="empty" style="grid-column:1/-1">В этой параллели детей не найдено.</div>';
      });
    };
    const firstCard=document.querySelector('.main .card');
    if(firstCard)firstCard.before(makeFilterBar(apply,true));
    apply();
  }
  /* 3. Раздел ИТОГИ ПО ДЕТЯМ у педагогов */
  if(h1==='Итоги по детям'){
    const list=document.querySelector('.main .card .list');

    };
    list.before(makeFilterBar(apply,true));
    apply();
  }

})();

 const schoolId=user().schoolId;
 for(const s of subjectsDefault){const category=['breakfast','lunch','snack'].includes(s.code)?'meal':['circle','break','extended'].includes(s.code)?'routine':'lesson';const {error}=await sb.from('subjects').upsert({school_id:schoolId,code:s.code,name:s.name,icon:s.icon,category,active:true},{onConflict:'school_id,code',ignoreDuplicates:true});if(error)throw error}

function metric(a,b,c){return `<div class="card metric"><small>${a}</small><b>${b}</b><span>${c}</span></div>`}
function subFor(scheduleId,date){return db.substitutions.find(x=>x.scheduleId===scheduleId&&x.date===date)}
function effectiveTeacherId(scheduleId,date=iso()){let l=db.schedule.find(x=>x.id===scheduleId),r=subFor(scheduleId,date);return r?.substituteTeacherId||l?.teacherId}
function effectiveLessons(date=iso(),teacherId=null){let wd=new Date(date+'T12:00:00').getDay();return db.schedule.filter(x=>x.active&&x.weekday===wd&&(!teacherId||effectiveTeacherId(x.id,date)===teacherId)).sort((a,b)=>a.start.localeCompare(b.start))}
function lessonMinutes(l){let [sh,sm]=String(l.start).split(':').map(Number),[eh,em]=String(l.end).split(':').map(Number);return Math.max(0,(eh*60+em)-(sh*60+sm))}
function workedMinutes(teacherId,start=iso(monday()),end=iso(add(monday(),4))){let mins=0,seen=new Set();for(let i=0;i<5;i++){let d=iso(add(monday(),i));if(d<start||d>end)continue;for(const l of db.schedule.filter(x=>x.active)){if(effectiveTeacherId(l.id,d)!==teacherId)continue;let done=db.attendance.some(a=>a.scheduleId===l.id&&a.date===d)||db.lessonRecords.some(x=>x.scheduleId===l.id&&x.date===d);if(done&&!seen.has(l.id+'|'+d)){mins+=lessonMinutes(l);seen.add(l.id+'|'+d)}}}return mins}
function fmtHours(mins){let h=Math.floor(mins/60),m=mins%60;return m?`${h} ч ${m} мин`:`${h} ч`}
function lessonRecord(scheduleId,date=iso()){return db.lessonRecords.find(x=>x.scheduleId===scheduleId&&x.date===date)}
function groupName(id){return db.groups.find(g=>g.id===id)?.name||''}
function targetName(l){return l.audienceType==='school'?'Вся школа':l.audienceType==='aftercare'?'Продлёнка':l.audienceType==='group'?groupName(l.groupId):cls(l.classId)?.name||'Класс не выбран'}
function childrenForLesson(l){if(l.audienceType==='school')return db.children.filter(k=>k.active);if(l.audienceType==='aftercare')return db.children.filter(k=>k.active&&k.aftercareActive);if(l.audienceType==='group')return db.children.filter(k=>k.active&&db.childGroups.some(x=>x.child_id===k.id&&x.group_id===l.groupId));return db.children.filter(k=>k.classId===l.classId&&k.active)}

function adDash(){let wd=new Date().getDay(),ls=db.schedule.filter(x=>x.weekday===wd&&x.active).sort((a,b)=>a.start.localeCompare(b.start)),s=iso(monday()),e=iso(add(monday(),4)),obs=db.observations.filter(o=>o.date>=s&&o.date<=e);return top('Дашборд','Вся школа в одном экране.','<button class="btn primary" onclick="scheduleModal()">+ Занятие</button>')+`<div class="grid g4">${metric('Классы',db.classes.filter(x=>x.active).length,'активные классы')}${metric('Дети',db.children.filter(x=>x.active).length,'зачислены')}${metric('Педагоги',db.profiles.filter(x=>x.role==='teacher'&&x.active).length,'с отдельным входом')}${metric('Наблюдения',obs.length,'за эту неделю')}</div><section class="section grid g2"><div class="card"><div class="sh"><div><h2>Занятия сегодня</h2><p>${days[wd]}</p></div></div>${ls.length?'<div class="list">'+ls.map(l=>lessonRow(l)).join('')+'</div>':'<div class="empty">Сегодня занятий нет.</div>'}</div><div class="card"><div class="sh"><div><h2>Последние наблюдения</h2><p>Что замечают педагоги</p></div></div><div class="list">${db.observations.slice().reverse().slice(0,5).map(obsRow).join('')||'<div class="empty">Пока нет наблюдений.</div>'}</div></div></section>`}

window.saveParent=async e=>{
 e.preventDefault();let f=new FormData(e.target),id=f.get('id'),name=f.get('name').trim(),active=f.get('active')==='true',childIds=f.getAll('children');

 let login=f.get('login').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');if(login.length<3)return toast('Логин: минимум 3 латинских символа');let password=f.get('password'),email=login+'@littleclan.local';

 let res=await authSb.auth.signUp({email,password}),uid=res.data?.user?.id;
 if(res.error){if(/already registered|already exists|user already registered/i.test(res.error.message)){let sign=await authSb.auth.signInWithPassword({email,password});if(sign.error)return toast('Такой аккаунт уже есть, но пароль не подошёл.');uid=sign.data?.user?.id}else{return toast('Не удалось создать аккаунт: '+res.error.message)}}
 if(!uid)return toast('Аккаунт не создан. Проверь настройки Email в Supabase.');

 let existing=await sb.from('profiles').select('id,role,school_id').eq('id',uid).maybeSingle();if(existing.error)return toast('Не удалось проверить профиль: '+existing.error.message);if(existing.data&&existing.data.role!=='parent')return toast('Этот аккаунт уже используется с другой ролью: '+roleName[existing.data.role]);
 let pr=await sb.from('profiles').upsert({id:uid,school_id:schoolId,role:'parent',full_name:name,active},{onConflict:'id'});if(pr.error)return toast('Аккаунт найден, но профиль не добавился: '+pr.error.message);
 let del=await sb.from('child_parents').delete().eq('parent_id',uid);if(del.error)return toast('Профиль создан, но старые привязки не обновились: '+del.error.message);if(childIds.length){let lr=await sb.from('child_parents').insert(childIds.map(cid=>({child_id:cid,parent_id:uid,relation_label:'Родитель'})));if(lr.error)return toast('Родитель создан, но дети не привязались: '+lr.error.message)}
 closeModal();await refresh();toast('Родитель создан. Логин: '+login);
};

const pdfStyle=`@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');@page{size:A4;margin:14mm}body{font-family:'Plus Jakarta Sans',sans-serif;color:#1C221C;background:#FFFDF9;padding:18px;border:1px solid #C5A572;outline:1px solid rgba(197,165,114,.35);outline-offset:-6px}.lux-svg{width:16px;height:16px;stroke:#1E3124;stroke-width:1.5;fill:none;vertical-align:-2px;margin-right:4px}.head{border-bottom:1.5px solid #C5A572;padding-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}.brand{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:#1E3124}h1{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;margin:22px 0 4px;color:#1C221C}h2,h3{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;margin:0 0 8px;color:#1E3124}.muted{color:#6E6A63;font-size:12px}.box{border:1px solid #DFD5C5;background:#FAF7F2;border-radius:14px;padding:15px 18px;margin:12px 0;break-inside:avoid}.box p{line-height:1.6;font-size:12.5px;margin:6px 0}.box p b{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6E6A63}.tag{display:inline-block;padding:5px 10px;background:#E9EFE8;color:#1E3124;border:1px solid rgba(58,82,63,.2);border-radius:99px;margin:3px;font-size:11px;font-weight:600}.foot{margin-top:28px;border-top:1px solid #DFD5C5;padding-top:12px;color:#6E6A63;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;text-align:center}`;
window.feedbackPdf=(kidId,fid)=>{let k=kid(kidId),f=db.feedbackReports.find(x=>x.id===fid);if(!k||!f)return toast('Отчёт не найден');let doc=`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Little Clan — ${esc(k.name)}</title><style>${pdfStyle}</style></head><body>${feedbackHtml(k,f)}<script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`;let w=window.open('','_blank');if(!w)return toast('Разрешите всплывающие окна');w.document.write(doc);w.document.close();toast('В окне печати выберите «Сохранить как PDF»')};
