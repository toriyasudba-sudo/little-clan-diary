<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Little Clan Diary — Семейная хроника роста</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE6;--bg-top:#FAF7F2;--card:#FFFDF9;--ink:#1C221C;--muted:#6E6A63;
  --green:#1E3124;--green2:#3A523F;--soft:#E9EFE8;--line:#DFD5C5;
  --gold:#C5A572;--goldSoft:rgba(197,165,114,.28);
  --orange:#B85D3B;--orangeSoft:#F6E6DE;--yellow:#B88928;--yellowSoft:#F9F0DA;
  --red:#9E4740;--redSoft:#F4E1DF;
  --shadow:0 18px 44px -12px rgba(28,34,28,.08);
  --shadow-card:0 10px 28px -8px rgba(30,25,20,.05);
  --font-serif:'Cormorant Garamond',Georgia,serif;
  --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,var(--bg-top),var(--bg));color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
svg.lux-svg{width:19px!important;height:19px!important;min-width:19px;stroke:var(--green)!important;stroke-width:1.6!important;fill:none!important;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;display:inline-block}
.ico svg.lux-svg{width:20px!important;height:20px!important;vertical-align:0}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#243829,#162419);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);box-shadow:0 6px 18px rgba(22,36,25,.16);flex:0 0 auto;font-size:19px}
.logo svg{width:21px!important;height:21px!important;stroke:var(--gold)!important;stroke-width:1.6!important;fill:none!important}
.brand strong{display:block;font-family:var(--font-serif);font-size:20px;font-weight:700;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-top:2px}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 12% 18%,rgba(197,165,114,.16) 0,transparent 38%)}
.loginbox{width:min(980px,100%);display:grid;grid-template-columns:1.1fr .9fr;border:1px solid var(--goldSoft);border-radius:28px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.hero{padding:44px;background:linear-gradient(145deg,#FAF5EC,#EFECE4);border-right:1px solid var(--line)}
.hero h1{font-family:var(--font-serif);font-size:clamp(38px,5.5vw,62px);font-weight:600;line-height:.98;margin:32px 0 18px}
.hero h1 span{color:var(--green);font-style:italic}
.hero p{font-size:15.5px;color:var(--muted);line-height:1.65}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pill{padding:8px 13px;border:1px solid rgba(197,165,114,.38);background:#FFFDF9;border-radius:99px;font-size:11px;font-weight:600}
.pill b{color:var(--gold);margin-right:4px}
.loginform{padding:40px;display:flex;flex-direction:column;justify-content:center}
.loginform h2{margin:0 0 6px;font-family:var(--font-serif);font-size:32px;font-weight:600}
.loginform>p{margin:0 0 22px;color:var(--muted);font-size:14px}
.field{display:grid;gap:6px;margin-bottom:13px}
.field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#FFFDF9;color:var(--ink);outline:none;font-size:14px}
textarea{min-height:96px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(197,165,114,.16)}
.btn{border:0;border-radius:99px;padding:9px 15px;font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.primary{background:linear-gradient(145deg,#243829,#18271C);color:#FAF7F2;border:1px solid rgba(197,165,114,.45)}
.soft{background:var(--soft);color:var(--green);border:1px solid rgba(58,82,63,.15)}
.ghost{background:#FFFDF9;border:1px solid var(--line);color:var(--ink)}
.wide{width:100%}
.demo{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.demo small{color:var(--muted);font-size:12px}
.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.side{position:sticky;top:0;height:100vh;padding:22px 15px;background:linear-gradient(180deg,#1A281E,#141F17);color:#FAF7F2;display:flex;flex-direction:column;gap:18px;border-right:1px solid rgba(197,165,114,.25)}
.side .brand strong{color:#FAF7F2}.side .brand small{color:var(--gold)}
.nav{display:grid;gap:4px;overflow-y:auto}
.nav button{border:1px solid transparent;background:transparent;color:rgba(250,247,242,.7);padding:10px 13px;border-radius:12px;text-align:left;font-weight:500;font-size:13px;cursor:pointer}
.nav button.on{background:rgba(197,165,114,.16);color:#FFFDF9;border-color:rgba(197,165,114,.35);font-weight:600}
.spacer{flex:1}
.me{padding:13px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(197,165,114,.2)}
.me strong{font-family:var(--font-serif);font-size:16px;color:#FFFDF9}
.me small{display:block;color:var(--gold);margin-top:2px;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.logout{width:100%;margin-top:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
.main{min-width:0;padding:28px clamp(14px,3vw,38px) 60px;max-width:1380px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(197,165,114,.28);flex-wrap:wrap}
.top h1{margin:0 0 4px;font-family:var(--font-serif);font-size:clamp(28px,3.4vw,42px);font-weight:600;line-height:1.05}
.top p{margin:0;color:var(--muted);font-size:13px}
.topright{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{padding:6px 11px;border-radius:99px;background:#F3ECE0;border:1px solid var(--gold);color:var(--ink);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.cloud{padding:6px 11px;border-radius:99px;background:#FFFDF9;border:1px solid var(--line);color:var(--muted);font-size:11px}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid rgba(197,165,114,.28);border-radius:22px;padding:18px;box-shadow:var(--shadow-card);min-width:0;overflow:hidden}
.metric{background:linear-gradient(160deg,#FFFDF9,#FAF5EC);outline:1px solid rgba(197,165,114,.15);outline-offset:-5px}
.metric small{color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.metric b{display:block;font-family:var(--font-serif);font-size:42px;font-weight:600;line-height:1;margin-top:8px;color:var(--green)}
.metric span{display:block;color:var(--muted);margin-top:6px;font-style:italic;font-family:var(--font-serif);font-size:15px}
.section{margin-top:20px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sh h2,.sh h3{margin:0;font-family:var(--font-serif);font-size:22px;font-weight:600}
.sh p{margin:2px 0 0;color:var(--muted);font-size:12px}
.list{display:grid;gap:8px;min-width:0}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:15px;background:#FFFDF9;flex-wrap:wrap;min-width:0}
.rowmain{flex:1 1 140px;min-width:0}
.rowmain strong{display:block;font-size:13.5px;font-weight:600;word-break:break-word}
.rowmain small{display:block;margin-top:2px;color:var(--muted);font-size:11.5px;line-height:1.4}
.time{padding:5px 9px;border-radius:9px;background:#F6F1E7;border:1px solid rgba(197,165,114,.35);color:var(--green);font-family:var(--font-serif);font-weight:700;font-size:13px;white-space:nowrap}
.ico{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#F6EFE2;border:1px solid rgba(197,165,114,.35);font-size:16px;flex:0 0 auto}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#243829,#17251B);color:#F6EFE2;border:1.5px solid var(--gold);font-family:var(--font-serif);font-size:14px;font-weight:600;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;background:#F2ECE1;border:1px solid rgba(197,165,114,.24);font-size:11px;font-weight:600;white-space:nowrap}
.green{background:var(--soft);color:var(--green)}.yellow{background:var(--yellowSoft);color:#7D5B14}.red{background:var(--redSoft);color:var(--red)}.orange{background:var(--orangeSoft);color:var(--orange)}
.box{background:#FAF6EE;border:1px solid rgba(197,165,114,.35);border-radius:16px;padding:15px 17px;margin-top:12px}
.box h3{margin:0 0 8px;font-family:var(--font-serif);font-size:19px;font-weight:600;color:var(--green);border-bottom:1px solid rgba(197,165,114,.2);padding-bottom:6px}
.box p{margin:6px 0;font-size:13px;line-height:1.55}
.table{overflow-x:auto;border:1px solid rgba(197,165,114,.28);border-radius:16px;background:#FFFDF9;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:11px 12px;border-bottom:1px solid #EFE8DC;text-align:left;font-size:12.5px;vertical-align:middle}
th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#F8F3EA;font-weight:700}
tr:last-child td{border-bottom:0}
.attrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EFE8DC;flex-wrap:wrap}
.attrow:last-child{border-bottom:0}
.attactions{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.att{padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:#FFFDF9;font-size:11px;font-weight:600;cursor:pointer}
.att.on.present{background:var(--soft);color:var(--green)}.att.on.late{background:var(--yellowSoft);color:#7D5B14}.att.on.absent{background:var(--redSoft);color:var(--red)}
.herochild{display:flex;align-items:center;gap:14px;padding:20px;border:1px solid rgba(197,165,114,.4);border-radius:22px;background:linear-gradient(135deg,#F6F1E6,#EAEFE8)}
.herochild .avatar{width:52px;height:52px;font-size:20px}
.herochild h2{margin:0;font-family:var(--font-serif);font-size:26px}.herochild p{margin:3px 0 0;color:var(--muted);font-size:13px}
.feed{display:grid;gap:10px}
.feeditem{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:15px;border:1px solid rgba(197,165,114,.3);border-radius:18px;background:#FFFDF9}
.feeditem h3{margin:0;font-family:var(--font-serif);font-size:18px}.feeditem p{margin:5px 0 8px;line-height:1.55;font-size:13px}.feeditem footer{color:var(--muted);margin-top:6px;font-style:italic;font-family:var(--font-serif);font-size:13px}
.calendar{padding:18px;background:var(--card);border:1px solid rgba(197,165,114,.3);border-radius:20px}
.calhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.calhead b{font-family:var(--font-serif);font-size:21px;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;color:var(--muted);font-size:10px;font-weight:700}
.day{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#F8F4EC;font-family:var(--font-serif);font-size:14px;font-weight:600;position:relative}
.day.present:after,.day.late:after,.day.absent:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;bottom:3px}
.day.present:after{background:var(--green2)}.day.late:after{background:var(--yellow)}.day.absent:after{background:var(--red)}
.day.today{background:var(--green);color:#FFFDF9;border:1px solid var(--gold)}
.empty{text-align:center;padding:24px;color:var(--muted);border:1px dashed rgba(197,165,114,.45);border-radius:16px;background:rgba(255,253,249,.6);font-family:var(--font-serif);font-style:italic;font-size:16px}
.modalbg{position:fixed;inset:0;background:rgba(20,26,20,.55);z-index:50;display:grid;place-items:center;padding:12px}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--gold);border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-family:var(--font-serif);font-size:24px}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#F7F2E8;cursor:pointer;font-size:18px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.tagbtn{padding:6px 11px;border:1px solid var(--line);background:#FFFDF9;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer}
.tagbtn.on{background:var(--green);color:#FFFDF9;border-color:var(--gold)}
.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:#1E2D22;color:#FAF7F2;border:1px solid var(--gold);padding:12px 16px;border-radius:14px;opacity:0;transform:translateY(10px);transition:.2s;font-size:12px;max-width:340px;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* TWA Верхнее меню, фильтры, Таблицы и Меню Питания */
.mobilenav{display:none!important}
.mobiletop{display:none}
.mobiletop .logout{background:#F3ECE0!important;color:var(--green)!important;border:1px solid var(--gold)!important;font-weight:700}
.lux-menu-wrap{display:flex;align-items:center;gap:8px;background:#FAF5EC;border:1px solid var(--gold);border-radius:13px;padding:3px 11px}
.lux-menu-wrap span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.lux-top-select{border:0!important;background:transparent!important;padding:6px 2px!important;font-weight:700;font-size:13.5px!important;color:var(--green)!important;cursor:pointer;width:100%;box-shadow:none!important}
.lux-filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:14px;background:linear-gradient(145deg,#FFFDF9,#F6F0E4);border:1px solid rgba(197,165,114,.38);border-radius:16px}
.lux-grade-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lux-gpill{border:1px solid var(--line);background:#FFFDF9;color:var(--ink);padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer}
.lux-gpill.on{background:var(--green);color:#FAF7F2;border-color:var(--gold)}
.lux-search{max-width:250px;padding:8px 12px!important;border-radius:99px!important;font-size:12.5px!important;background:#fff!important}
.lux-kids-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:12px}
.lux-kid-card{background:linear-gradient(180deg,#FFFFFF,#FCF9F4);border:1px solid rgba(197,165,114,.32);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.lux-kid-head{display:flex;align-items:center;gap:10px}
.lux-kid-cls{margin-left:auto;padding:4px 10px;border-radius:99px;background:#F3ECE0;border:1px solid var(--gold);color:var(--green);font-family:var(--font-serif);font-weight:700;font-size:13.5px}
.lux-kid-actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px solid #EFE8DC}
.lux-grade-divider{grid-column:1/-1;font-family:var(--font-serif);font-size:21px;font-weight:700;color:var(--green);margin:8px 0 2px;padding-bottom:4px;border-bottom:1px solid rgba(197,165,114,.35)}

.lux-done-btn{padding:6px 12px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--gold);background:#FAF5EC;color:var(--ink);white-space:nowrap}
.lux-done-btn.is-done{background:linear-gradient(145deg,#243829,#18271C);color:#FAF7F2;border-color:var(--gold)}
.lux-hours-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;margin-bottom:14px;border-radius:18px;background:linear-gradient(135deg,#1E3124,#2B4432);color:#FAF7F2;border:1px solid var(--gold)}
.lux-hours-banner b{font-family:var(--font-serif);font-size:26px;color:var(--gold)}

.lux-cal-box{background:var(--card);border:1px solid rgba(197,165,114,.38);border-radius:20px;padding:14px 16px;margin-bottom:16px}
.lux-cal-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #EFE8DC}
.lux-cal-title{font-family:var(--font-serif);font-size:20px;font-weight:700;color:var(--green)}
.lux-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.lux-cal-dow{text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.lux-cal-cell{min-height:48px;border-radius:12px;border:1px solid #EFE8DC;background:#FAF7F1;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.lux-cal-cell.is-sel{border:2px solid var(--green);background:#E9EFE8}
.lux-cal-cell.is-today .lux-cal-num{background:var(--gold);color:#fff;border-radius:99px;padding:0 6px}
.lux-cal-num{font-family:var(--font-serif);font-size:14px;font-weight:700}
.lux-cal-stat{font-size:8.5px;font-weight:700;padding:1px 5px;border-radius:99px;margin-top:3px;white-space:nowrap}
.lux-cal-stat.all-done{background:var(--green);color:#FAF7F2}
.lux-cal-stat.part-done{background:var(--yellowSoft);color:#7D5B14}
.lux-cal-stat.none-done{background:#ECE6DA;color:var(--muted)}

.lux-score-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:11px;font-size:11.5px;font-weight:700;border:1px solid rgba(197,165,114,.45);background:#FAF6EE;margin:2px 4px 2px 0}
.lux-score-pill b{font-family:var(--font-serif);font-size:15px;padding:1px 6px;border-radius:7px;background:var(--green);color:#FAF7F2}
.lux-score-pill.mid b{background:var(--yellow)}.lux-score-pill.low b{background:var(--orange)}
.lux-score-pill.pf-pass b{background:var(--green);font-family:var(--font-sans);font-size:11px;padding:2px 7px}
.lux-score-pill.pf-fail b{background:var(--red);font-family:var(--font-sans);font-size:11px;padding:2px 7px}
.lux-avg-badge{display:inline-flex;align-items:center;justify-content:center;padding:5px 12px;border-radius:99px;background:linear-gradient(145deg,#243829,#18271C);color:#FAF7F2;border:1px solid var(--gold);font-family:var(--font-serif);font-size:16px;font-weight:700}
.lux-subsec-title{font-family:var(--font-serif);font-size:20px;font-weight:700;color:var(--green);margin:16px 0 8px}

.lux-meal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.lux-meal-box{background:linear-gradient(145deg,#FFFDF9,#F7F1E5);border:1px solid rgba(197,165,114,.4);border-radius:16px;padding:12px 14px}
.lux-meal-box small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--orange);margin-bottom:4px}
.lux-meal-box strong{display:block;font-family:var(--font-serif);font-size:17px;color:var(--ink);line-height:1.25}

.lux-sched-day{margin-bottom:18px;padding:16px;border-radius:20px;background:var(--card);border:1px solid rgba(197,165,114,.32);box-shadow:var(--shadow-card)}
.lux-sched-table{width:100%;border-collapse:separate;border-spacing:0;min-width:560px}

function isoDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function getMonday(d=new Date()){let x=new Date(d),k=x.getDay()||7;x.setHours(12,0,0,0);x.setDate(x.getDate()-k+1);return x}
function fmtDateRu(dStr,opts={day:'numeric',month:'long',year:'numeric'}){return new Intl.DateTimeFormat('ru-RU',opts).format(new Date(dStr+'T12:00:00'))}
function fmtShortDM(dStr){const [y,m,d]=String(dStr).split('-');return `${d}.${m}`}
function escH(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}

function getActiveRole(){
  const b=document.querySelector('.mobiletop .badge, .top .badge')?.textContent.trim()||'';
  if(b==='Родитель')return 'parent';
  if(b==='Педагог')return 'teacher';
  if(b==='Администратор')return 'admin';
  return window._lcCache.me?.role||'parent';
}
function isNonCountedSubj(subjObj,rawName=''){
  const code=subjObj?.code||'';
  const name=String(subjObj?.name||rawName||'').trim();
  if(['circle','breakfast','break','lunch','snack'].includes(code))return true;
  return /^(круг|завтрак|перемена|обед|полдник)$/i.test(name);
}
function getTabelSubjectMode(subjObj){
  if(!subjObj)return null;
  const code=String(subjObj.code||'').toLowerCase();
  const name=String(subjObj.name||'').trim().toLowerCase();
  if(['rus','math','reading','literature','world','eng'].includes(code))return 'score100';
  if(/^(русский язык|математика|чтение|литература|литературное чтение|окружающий мир|английский язык)$/i.test(name))return 'score100';
  if(['ict','technology','music','art','project','calligraphy'].includes(code))return 'passfail';
  if(/^(икт|информатика|технология|музыка|изо|изобразительное искусство|проектная деятельность|каллиграфия)$/i.test(name))return 'passfail';
  return null;
}
/* Максимальный балл: для Английского языка — 60 баллов, для остальных основных — 100 баллов */
function getSubjectMaxScore(subjObj){
  if(!subjObj)return 100;
  const code=String(subjObj.code||'').toLowerCase();
  const name=String(subjObj.name||'').trim().toLowerCase();
  if(code==='eng'||code==='native_eng'||/английск|english/i.test(name))return 60;
  return 100;
}

}

async function getSb(){
  if(window._luxSb)return window._luxSb;
  const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  window._luxSb=mod.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  return window._luxSb;
}
async function syncCache(force=false){
  try{
    const client=await getSb();
    const {data:{session}}=await client.auth.getSession();
    const uid=session?.user?.id||null;
    if(!uid){window._lcCache.ready=false;window._lcLastUid=null;return;}
    if(!force&&window._lcCache.ready&&window._lcLastUid===uid)return;
    window._lcLastUid=uid;
    const [meR,schR,recR,attR,subR,profR,clsR,subjR,grpR,cgR,chR,plR,obsR]=await Promise.all([
      client.from('profiles').select('id,school_id,role,full_name').eq('id',uid).maybeSingle(),
      client.from('schedule').select('*').eq('active',true),
      client.from('lesson_records').select('*'),
      client.from('attendance').select('id,child_id,schedule_id,lesson_date,status'),
      client.from('lesson_substitutions').select('*'),
      client.from('profiles').select('id,school_id,role,full_name,active'),
      client.from('classes').select('id,name,active'),
      client.from('subjects').select('id,code,name,icon,category,active'),
      client.from('groups').select('id,name,group_type,active'),
      client.from('child_groups').select('child_id,group_id'),
      client.from('children').select('id,school_id,class_id,first_name,last_name,aftercare_active,active'),
      client.from('child_parents').select('child_id,parent_id'),
      client.from('observations').select('*')
    ]);
    let subjectsList=subjR.data||[];
    if(meR.data?.school_id&&!subjectsList.some(s=>s.code==='calligraphy'||/каллиграф/i.test(s.name))){
      const ins=await client.from('subjects').upsert({school_id:meR.data.school_id,code:'calligraphy',name:'Каллиграфия',icon:'✒️',category:'lesson',active:true},{onConflict:'school_id,code',ignoreDuplicates:true}).select();
      if(ins.data?.length)subjectsList=[...subjectsList,...ins.data];
    }
    window._lcCache={
      ready:true,me:meR.data,
      schedule:schR.data||[],records:recR.data||[],attendance:attR.data||[],
      subs:subR.data||[],profiles:profR.data||[],classes:clsR.data||[],
      subjects:subjectsList,groups:grpR.data||[],childGroups:cgR.data||[],
      children:(chR.data||[]).map(k=>({...k,name:[k.last_name,k.first_name].filter(Boolean).join(' ')})),
      parentLinks:plR.data||[],observations:obsR.data||[]
    };
    if(clsR.data)window._lcClasses=clsR.data.filter(x=>x.active).map(x=>x.name);
  }catch(e){console.warn('Cache sync:',e)}
}

function getMenuData(){
  let data=JSON.parse(JSON.stringify(DEFAULT_MENU));
  let activeWeek=1;
  const menuObs=window._lcCache.observations.filter(o=>(o.tags||[])[0]==='__MENU__').sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  if(menuObs.length){
    const last=menuObs[menuObs.length-1];
    try{
      const parsed=JSON.parse(last.note||'{}');
      if(parsed.menu)data=parsed.menu;
      if(parsed.activeWeek)activeWeek=Number(parsed.activeWeek)||1;
    }catch(e){}
  }
  return {menu:data,activeWeek};
}

function getSelectedParentChild(){
  const c=window._lcCache;
  if(!c.me)return null;
  const myKids=c.parentLinks.filter(x=>x.parent_id===c.me.id).map(x=>c.children.find(k=>k.id===x.child_id&&k.active)).filter(Boolean);
  const selId=sessionStorage.getItem('PARENT_CHILD');
  return myKids.find(x=>x.id===selId)||myKids[0]||null;
}

function getCleanChildLessonsForDay(childObj,weekday){
  if(!childObj)return [];
  const c=window._lcCache;
  const myGroupIds=new Set(c.childGroups.filter(x=>x.child_id===childObj.id).map(x=>x.group_id));
  const raw=c.schedule.filter(l=>{
    if(!l.active||Number(l.weekday)!==Number(weekday))return false;
    if(l.group_id||l.audience_type==='group')return myGroupIds.size?myGroupIds.has(l.group_id):true;
    if(l.audience_type==='school')return true;
    if(l.audience_type==='aftercare')return childObj.aftercare_active!==false;
    return l.class_id===childObj.class_id;
  }).sort((a,b)=>String(a.starts_at).localeCompare(String(b.starts_at)));

  const byTime=new Map();
  raw.forEach(l=>{
    const key=String(l.starts_at).slice(0,5);
    if(!byTime.has(key)){byTime.set(key,l);return;}
    const prev=byTime.get(key);
    if(myGroupIds.has(l.group_id)&&!myGroupIds.has(prev.group_id))byTime.set(key,l);
    else if(l.class_id===childObj.class_id&&prev.class_id!==childObj.class_id)byTime.set(key,l);
  });
  return [...byTime.values()];
}

function getKidsForScheduleLesson(l){
  const c=window._lcCache;
  if(!l)return [];
  if(l.audience_type==='school')return c.children.filter(k=>k.active);
  if(l.audience_type==='aftercare')return c.children.filter(k=>k.active&&k.aftercare_active!==false);
  if(l.audience_type==='group'||l.group_id)return c.children.filter(k=>k.active&&c.childGroups.some(cg=>cg.child_id===k.id&&cg.group_id===l.group_id));
  return c.children.filter(k=>k.active&&k.class_id===l.class_id);
}

function isLessonDone(scheduleId,dateStr){
  const c=window._lcCache;
  return c.records.some(r=>r.schedule_id===scheduleId&&r.lesson_date===dateStr)||
         c.attendance.some(a=>a.schedule_id===scheduleId&&a.lesson_date===dateStr);
}
function effTeacher(l,dateStr){
  const sub=window._lcCache.subs.find(s=>s.schedule_id===l.id&&s.lesson_date===dateStr);
  return sub?sub.substitute_teacher_id:l.teacher_id;
}
function calcTeacherStats(teacherId,fromStr,toStr){
  const c=window._lcCache;
  let doneHours=0,planHours=0,doneCount=0,planCount=0;
  const items=[];
  let cur=new Date(fromStr+'T12:00:00'),end=new Date(toStr+'T12:00:00');
  while(cur<=end){
    const dStr=isoDate(cur),wd=cur.getDay();
    if(wd>=1&&wd<=5){
      const dayLs=c.schedule.filter(l=>l.active&&Number(l.weekday)===wd&&(!teacherId||effTeacher(l,dStr)===teacherId));
      dayLs.sort((a,b)=>String(a.starts_at).localeCompare(String(b.starts_at)));
      dayLs.forEach(l=>{
        const subjObj=c.subjects.find(s=>s.id===l.subject_id);
        const subj=subjObj?.name||'Предмет';
        const nonCount=isNonCountedSubj(subjObj,subj);
        const h=nonCount?0:1;
        const done=isLessonDone(l.id,dStr);
        const rec=c.records.find(r=>r.schedule_id===l.id&&r.lesson_date===dStr);
        const tName=c.profiles.find(p=>p.id===effTeacher(l,dStr))?.full_name||'Педагог';
        const target=l.audience_type==='school'?'Вся школа':l.audience_type==='aftercare'?'Продлёнка':l.audience_type==='group'?(c.groups.find(g=>g.id===l.group_id)?.name||'Группа'):(c.classes.find(cl=>cl.id===l.class_id)?.name||'Класс');
        if(!nonCount){
          planHours+=h;planCount++;
          if(done){doneHours+=h;doneCount++;}
        }
        items.push({scheduleId:l.id,date:dStr,weekday:wd,start:String(l.starts_at).slice(0,5),end:String(l.ends_at).slice(0,5),hours:h,nonCount,done,topic:rec?.topic||'',subj,icon:subjObj?.icon||'📘',target,teacherName:tName,teacherId:effTeacher(l,dStr)});
      });
    }
    cur.setDate(cur.getDate()+1);
  }
  return {doneHours,planHours,doneCount,planCount,items};
}

function buildCalendarWidgetHtml(teacherIdOrNull){
  const [yStr,mStr]=window._lcCalMonth.split('-');
  const y=Number(yStr),m=Number(mStr)-1;
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const monthTitle=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(first);
  const offset=(first.getDay()+6)%7;
  const cells=[];
  for(let i=0;i<offset;i++)cells.push(null);
  for(let d=1;d<=last.getDate();d++)cells.push(d);

  const mon=getMonday(new Date(window._lcSelectedDate+'T12:00:00'));
  const fri=addDays(mon,4);
  const weekRange=`${fmtDateRu(isoDate(mon),{day:'numeric',month:'short'})} — ${fmtDateRu(isoDate(fri),{day:'numeric',month:'short',year:'numeric'})}`;

  const gridHtml=cells.map(d=>{
    if(!d)return `<div></div>`;
    const dStr=`${yStr}-${mStr}-${String(d).padStart(2,'0')}`;
    const wd=new Date(dStr+'T12:00:00').getDay();
    let badge='';
    if(wd>=1&&wd<=5){
      const st=calcTeacherStats(teacherIdOrNull,dStr,dStr);
      if(st.planCount>0){
        const cls=st.doneCount===st.planCount?'all-done':st.doneCount>0?'part-done':'none-done';
        badge=`<span class="lux-cal-stat ${cls}">${st.doneCount===st.planCount?'✓ ':''}${st.doneCount}/${st.planCount} ч</span>`;
      }
    }
    return `<div class="lux-cal-cell ${dStr===window._lcSelectedDate?'is-sel':''} ${dStr===isoDate()?'is-today':''}" onclick="selectCalendarDate('${dStr}')"><span class="lux-cal-num">${d}</span>${badge}</div>`;
  }).join('');

  return `<div class="lux-cal-box">
    <div class="lux-cal-top">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <button type="button" class="btn ghost" onclick="shiftSelectedWeek(-7)">← Неделя</button>
        <span class="lux-cal-title">📅 ${weekRange}</span>
        <button type="button" class="btn ghost" onclick="shiftSelectedWeek(7)">Неделя →</button>
        <button type="button" class="btn soft" onclick="selectCalendarDate('${isoDate()}')">Сегодня (${fmtShortDM(isoDate())})</button>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <input type="date" value="${window._lcSelectedDate}" style="width:auto;padding:6px 10px" onchange="selectCalendarDate(this.value)">
        <button type="button" class="btn ghost" onclick="window._lcShowMonthGrid=!window._lcShowMonthGrid;onRender()">${window._lcShowMonthGrid?'Скрыть месяц ▲':'Календарь месяца ▼'}</button>
      </div>
    </div>
    ${window._lcShowMonthGrid?`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <button type="button" class="btn ghost" style="padding:4px 10px" onclick="shiftCalMonth(-1)">‹ Пред.</button>
        <b style="font-family:var(--font-serif);font-size:17px;text-transform:capitalize">${monthTitle}</b>
        <button type="button" class="btn ghost" style="padding:4px 10px" onclick="shiftCalMonth(1)">След. ›</button>
      </div>
      <div class="lux-cal-grid">
        ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>`<div class="lux-cal-dow">${w}</div>`).join('')}
        ${gridHtml}
      </div>
    `:''}
  </div>`;
}

window.selectCalendarDate=(dStr)=>{
  if(!dStr)return;
  window._lcSelectedDate=dStr;
  window._lcCalMonth=dStr.slice(0,7);
  const daysRu=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const wd=new Date(dStr+'T12:00:00').getDay();
  if(wd>=1&&wd<=5)window._lcSchedDay=daysRu[wd];
  onRender();
};
window.shiftSelectedWeek=(deltaDays)=>{
  const next=addDays(new Date(window._lcSelectedDate+'T12:00:00'),deltaDays);
  window._lcSelectedDate=isoDate(next);
  window._lcCalMonth=window._lcSelectedDate.slice(0,7);
  window._lcSchedDay='all';
  onRender();
};

window.toggleLessonDone=async(scheduleId,dateStr,teacherIdOverride,ev)=>{
  if(ev)ev.stopPropagation();
  if(getActiveRole()==='parent')return;
  const client=await getSb();
  await syncCache(true);
  const c=window._lcCache;
  if(!c.me)return alert('Сессия не найдена, обновите страницу');
  const existing=c.records.find(r=>r.schedule_id===scheduleId&&r.lesson_date===dateStr);
  const hasAtt=c.attendance.some(a=>a.schedule_id===scheduleId&&a.lesson_date===dateStr);
  const l=c.schedule.find(x=>x.id===scheduleId);
  const tid=teacherIdOverride||effTeacher(l||{},dateStr)||c.me.id;

  if(existing||hasAtt){
    if(!confirm(`Снять отметку о проведении урока за ${fmtDateRu(dateStr)}?`))return;
    if(existing)await client.from('lesson_records').delete().eq('id',existing.id);
    if(hasAtt)await client.from('attendance').delete().eq('schedule_id',scheduleId).eq('lesson_date',dateStr);
  }else{
    const {error}=await client.from('lesson_records').insert({
      school_id:c.me.school_id,schedule_id:scheduleId,lesson_date:dateStr,
      teacher_id:tid,topic:'Урок проведён',note:'Подтверждено за '+dateStr+' (1 ч)'
    });
    if(error)return alert('Не удалось отметить урок: '+error.message);
    const kids=getKidsForScheduleLesson(l);
    if(kids.length){
      const attRows=kids.map(k=>({school_id:c.me.school_id,child_id:k.id,schedule_id:scheduleId,lesson_date:dateStr,status:'present',marked_by:c.me.id}));
      await client.from('attendance').upsert(attRows,{onConflict:'child_id,schedule_id,lesson_date',ignoreDuplicates:true});
    }
  }
  await syncCache(true);
  if(window.restoreSubject)await window.restoreSubject('00000000-0000-0000-0000-000000000000');
  onRender();
};

function upgradeObservationEditButtons(){
  const role=getActiveRole();
  if(role!=='teacher'&&role!=='admin')return;
  const c=window._lcCache;
  if(!c.ready)return;
  const h1=document.querySelector('.main .top h1')?.textContent.trim()||'';
  if(h1!=='Наблюдения'&&h1!=='Дашборд')return;

  const normalObs=c.observations.filter(o=>!parseTabelObs(o)&&!(o.tags||[]).includes('__MENU__')&&!(o.tags||[]).includes('__TABEL_DELETED__'));
  const usedIds=new Set();

  document.querySelectorAll('.main .list .row').forEach(r=>{
    if(r.querySelector('.lux-edit-obs-btn')||r.querySelector('.time'))return;
    const st=r.querySelector('.rowmain strong')?.textContent||'';
    const smalls=r.querySelectorAll('.rowmain small');
    if(!smalls.length)return;
    const noteText=smalls[0].textContent.trim();
    const kidPart=(st.split('·')[0]||'').trim();

    const match=normalObs.slice().reverse().find(o=>{
      if(usedIds.has(o.id))return false;
      const kName=c.children.find(k=>k.id===o.child_id)?.name||'';
      return String(o.note||'').trim()===noteText&&(!kidPart||kName===kidPart);
    });
    if(match){
      usedIds.add(match.id);
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='btn soft lux-edit-obs-btn';
      btn.style.cssText='padding:6px 12px;font-size:11.5px;margin-left:auto';
      btn.innerHTML='✎ Изменить';
      btn.onclick=(ev)=>{ev.stopPropagation();window.openEditObservationModal(match.id)};
      r.appendChild(btn);
    }
  });
}

/* --- ТАБЕЛЬ УСПЕВАЕМОСТИ (4 предмета 100 баллов + Английский 60 баллов + 6 предметов Зачёт/Незачёт) --- */
function parseTabelObs(o){
  const t=o.tags||[];
  if(t[0]==='__TABEL_DELETED__'||t[0]==='__MENU__')return null;
  if(t[0]==='__TABEL__')return {id:o.id,kind:'score100',childId:o.child_id,subjectId:o.subject_id,teacherId:o.teacher_id,date:o.observed_on,type:t[1]||'Проверочная работа',score:Number(t[2]||0),topic:o.note||''};
  if(t[0]==='__TABEL_PF__'){
    const st=t[2]==='fail'?'fail':'pass';
    return {id:o.id,kind:'passfail',childId:o.child_id,subjectId:o.subject_id,teacherId:o.teacher_id,date:o.observed_on,type:t[1]||'Зачётная работа',status:st,label:st==='pass'?'Зачёт':'Незачёт',topic:o.note||''};
  }
  return null;
}
function getChildScores(childId){
  return window._lcCache.observations.map(parseTabelObs).filter(x=>x&&(!childId||x.childId===childId)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function cleanObservationFeeds(){
  document.querySelectorAll('.row, .feeditem').forEach(el=>{
    if(/__TABEL__|__TABEL_PF__|__MENU__|__TABEL_DELETED__/.test(el.textContent))el.remove();
  });
  document.querySelectorAll('.chips .chip').forEach(ch=>{
    const txt=ch.textContent.trim();
    if(/__TABEL|__MENU|^(100|\d{1,2})\s*·\s*\d+$|^(Проверочная работа|Контрольная работа|Зачётная работа|pass|fail)\s*·/i.test(txt)){
      ch.remove();
    }
  });
}

  onRender();
};

function buildChildTabelHtml(childId,allowEditParam=false){
  const role=getActiveRole();
  const canEdit=allowEditParam&&(role==='admin'||role==='teacher');
  const c=window._lcCache;
  const k=c.children.find(x=>x.id===childId);if(!k)return '<div class="empty">Ребёнок не найден</div>';
  const clsName=c.classes.find(x=>x.id===k.class_id)?.name||'';
  const order100=['rus','math','reading','literature','world','eng'];
  const scoreSubs=c.subjects.filter(s=>s.active&&getTabelSubjectMode(s)==='score100').sort((a,b)=>order100.indexOf(a.code)-order100.indexOf(b.code));
  const orderPF=['ict','technology','music','art','project','calligraphy'];
  const pfSubs=c.subjects.filter(s=>s.active&&getTabelSubjectMode(s)==='passfail').sort((a,b)=>orderPF.indexOf(a.code)-orderPF.indexOf(b.code));

  const allEntries=getChildScores(childId);
  const entries100=allEntries.filter(x=>x.kind==='score100');
  const entriesPF=allEntries.filter(x=>x.kind==='passfail');

  const entriesMain100=entries100.filter(x=>getSubjectMaxScore(c.subjects.find(s=>s.id===x.subjectId))===100);
  const entriesEng60=entries100.filter(x=>getSubjectMaxScore(c.subjects.find(s=>s.id===x.subjectId))===60);
  const avg100=entriesMain100.length?Math.round(entriesMain100.reduce((a,b)=>a+b.score,0)/entriesMain100.length):null;
  const avg60=entriesEng60.length?Math.round(entriesEng60.reduce((a,b)=>a+b.score,0)/entriesEng60.length):null;

  const rows100=scoreSubs.map(s=>{
    const maxS=getSubjectMaxScore(s);
    const sc=entries100.filter(x=>x.subjectId===s.id);
    const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b.score,0)/sc.length):null;
    const pills=sc.map(x=>{
      const pct=(x.score/maxS)*100;
      const clsP=pct>=80?'':pct>=60?'mid':'low';
      return `<span class="lux-score-pill ${clsP}"><b>${x.score}/${maxS}</b> <span>${x.type==='Контрольная работа'?'Контр.':'Проверочн.'}${x.topic?' · '+escH(x.topic):''} <small>(${fmtShortDM(x.date)})</small></span>${canEdit?`<button type="button" style="border:0;background:0;color:var(--red);cursor:pointer;font-weight:700" onclick="deleteScoreEntry('${x.id}','${childId}')">×</button>`:''}</span>`;
    }).join('');
    return `<tr><td><b>${escH(displayTabelSubjName(s))}</b> <small style="color:var(--muted)">(из ${maxS} б.)</small></td><td>${pills||'<span style="color:var(--muted);font-size:12px">Работ пока не было</span>'}</td><td style="text-align:center">${avg!==null?`<span class="lux-avg-badge">${avg}/${maxS}</span>`:'—'}</td>${canEdit?`<td style="text-align:right"><button type="button" class="btn soft" onclick="openAddScoreModal('${childId}','${s.id}',true)">+ Балл</button></td>`:''}</tr>`;
  }).join('');

  const rowsPF=pfSubs.map(s=>{
    const sc=entriesPF.filter(x=>x.subjectId===s.id);
    const last=sc[sc.length-1]||null;
    const pills=sc.map(x=>`<span class="lux-score-pill ${x.status==='pass'?'pf-pass':'pf-fail'}"><b>${x.status==='pass'?'✓ Зачёт':'✕ Незачёт'}</b> <span>${escH(x.topic||x.type)} <small>(${fmtShortDM(x.date)})</small></span>${canEdit?`<button type="button" style="border:0;background:0;color:var(--red);cursor:pointer;font-weight:700" onclick="deleteScoreEntry('${x.id}','${childId}')">×</button>`:''}</span>`).join('');
    return `<tr><td><b>${escH(displayTabelSubjName(s))}</b></td><td>${pills||'<span style="color:var(--muted);font-size:12px">Зачётов пока нет</span>'}</td><td style="text-align:center">${last?(last.status==='pass'?'<span class="chip green">✓ ЗАЧЁТ</span>':'<span class="chip red">✕ НЕЗАЧЁТ</span>'):'—'}</td>${canEdit?`<td style="text-align:right"><button type="button" class="btn soft" onclick="openAddScoreModal('${childId}','${s.id}',true)">+ Зачёт</button></td>`:''}</tr>`;
  }).join('');

  return `<div class="lux-hours-banner"><div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.85">Академический Табель</div><div style="font-size:18px;font-weight:700;margin-top:2px">${escH(k.name)} · ${escH(clsName)} класс</div><div style="font-size:11.5px;opacity:.85;margin-top:2px">Основные предметы — из 100 б. · Английский язык — из 60 б. · Зачётные дисциплины</div></div><div style="text-align:right"><b>${avg100!==null?avg100+' / 100':'—'}</b><div style="font-size:11.5px;opacity:.9">${avg60!==null?`Англ. яз.: ${avg60}/60 · `:''}Зачётов: ${entriesPF.filter(x=>x.status==='pass').length}</div></div></div>
  <div class="actions" style="margin:0 0 10px;justify-content:space-between"><button type="button" class="btn ghost" onclick="printChildTabelPdf('${childId}')">⇩ Скачать PDF</button>${canEdit?`<button type="button" class="btn primary" onclick="openAddScoreModal('${childId}','',true)">+ Выставить балл / зачёт</button>`:''}</div>
  <div class="lux-subsec-title">I. Основные предметы (Русский, Математика, Литература, Окр. мир — из 100 б. · Английский — из 60 б.)</div>
  <div class="table"><table><thead><tr><th>Предмет</th><th>Проверочные и контрольные работы</th><th style="text-align:center">Средний</th>${canEdit?'<th></th>':''}</tr></thead><tbody>${rows100}</tbody></table></div>
  <div class="lux-subsec-title">II. Зачётные дисциплины (Зачёт / Незачёт)</div>
  <div class="table"><table><thead><tr><th>Предмет</th><th>Зачёты и проекты</th><th style="text-align:center">Итог</th>${canEdit?'<th></th>':''}</tr></thead><tbody>${rowsPF}</tbody></table></div>`;
}

    main.innerHTML=`<div class="top"><div><h1>★ Табель успеваемости</h1><p>Основные предметы (100 б.), Английский язык (60 б.) и система «Зачёт / Незачёт»</p></div></div>
    ${myKids.length>1?`<div class="card" style="margin-bottom:14px"><div class="chips">${myKids.map(x=>`<button class="btn ${x.id===k?.id?'primary':'soft'}" onclick="sessionStorage.setItem('PARENT_CHILD','${x.id}');renderTabelPageView()">${escH(x.first_name)}</button>`).join('')}</div></div>`:''}

    return extractGrade(ca).localeCompare(extractGrade(cb))||ca.localeCompare(cb,'ru')||a.name.localeCompare(b.name,'ru');
  });
  main.innerHTML=`<div class="top"><div><h1>★ Табель успеваемости</h1><p>Русский, Математика, Литература, Окр. мир (из 100 б.) · Английский (из 60 б.) · ИКТ, Технология, Музыка, ИЗО, Проекты, Каллиграфия (Зачёт)</p></div><div class="topright"><button class="btn primary" onclick="openAddScoreModal('','',false)">+ Выставить балл / зачёт</button></div></div><div id="luxTabelFilterMount"></div><div id="luxTabelKidsGrid" class="lux-kids-grid"></div>`;
  const grid=main.querySelector('#luxTabelKidsGrid');
  const renderList=()=>{
    grid.innerHTML='';let lastG=null;const q=window._lcSearch;
    kids.forEach(k=>{
      const clsName=c.classes.find(x=>x.id===k.class_id)?.name||'',g=extractGrade(clsName);
      if((window._lcGrade!=='all'&&g!==window._lcGrade)||(q&&!(k.name+' '+clsName).toLowerCase().includes(q)))return;
      if(window._lcGrade==='all'&&g!==lastG){
        lastG=g;const div=document.createElement('div');div.className='lux-grade-divider';
        div.textContent=g==='other'?'Другие классы':`${g} параллель (${g} класс)`;grid.appendChild(div);
      }
      const allSc=getChildScores(k.id);
      const sc100=allSc.filter(x=>x.kind==='score100'&&getSubjectMaxScore(c.subjects.find(s=>s.id===x.subjectId))===100);
      const sc60=allSc.filter(x=>x.kind==='score100'&&getSubjectMaxScore(c.subjects.find(s=>s.id===x.subjectId))===60);
      const scPF=allSc.filter(x=>x.kind==='passfail'&&x.status==='pass');
      const avg100=sc100.length?Math.round(sc100.reduce((a,b)=>a+b.score,0)/sc100.length):null;
      const avg60=sc60.length?Math.round(sc60.reduce((a,b)=>a+b.score,0)/sc60.length):null;
      const card=document.createElement('div');card.className='lux-kid-card';
      const ini=k.name.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
      card.innerHTML=`<div class="lux-kid-head"><span class="avatar">${ini}</span><div class="rowmain"><strong>${escH(k.name)}</strong><small>${avg100!==null?`Ср. (100 б.): <b>${avg100}/100</b> · `:''}${avg60!==null?`Англ.: <b>${avg60}/60</b> · `:''}Зачётов: <b>${scPF.length}</b></small></div><span class="lux-kid-cls">${escH(clsName)}</span></div>
      <div class="lux-kid-actions"><button type="button" class="btn primary" onclick="openChildTabelModal('${k.id}')">★ Открыть табель</button><button type="button" class="btn soft" onclick="openAddScoreModal('${k.id}','',false)">+ Балл / Зачёт</button></div>`;
      grid.appendChild(card);
    });
  };
  main.querySelector('#luxTabelFilterMount').appendChild(makeFilterBar(renderList,true));
  renderList();
}

function extractGrade(s){
  const m=String(s||'').trim().match(/^([1-4])(?![0-9])|([1-4])\s*кл/i);
  return m?(m[1]||m[2]):'other';
}
function sortTargets(list){
  return list.slice().sort((a,b)=>extractGrade(a).localeCompare(extractGrade(b))||a.localeCompare(b,'ru'));
}
function buildTopDropdown(){
  const sideNav=document.querySelector('.side .nav');
  if(sideNav&&!sideNav.querySelector('button[data-tabel]')){
    sideNav.querySelectorAll('button').forEach(x=>x.addEventListener('click',()=>{window._lcCustomPage=null}));
    const b1=document.createElement('button');b1.dataset.tabel='1';b1.textContent='★ Табель успеваемости';b1.onclick=()=>window.openTabelPage();
    const b2=document.createElement('button');b2.dataset.menu='1';b2.textContent='🍽️ Меню питания';b2.onclick=()=>window.openMenuPage();
    sideNav.appendChild(b1);sideNav.appendChild(b2);
  }
  const navBtns=[...document.querySelectorAll('.side .nav button')];
  if(!navBtns.length)return;
  const seen=new Set(),items=[];
  navBtns.forEach(b=>{
    if(b.dataset.tabel){items.push({route:'__tabel__',label:'★ Табель успеваемости',on:window._lcCustomPage==='tabel'});return;}
    if(b.dataset.menu){items.push({route:'__menu__',label:'🍽️ Меню питания',on:window._lcCustomPage==='menu'});return;}
    const m=(b.getAttribute('onclick')||'').match(/go\(['"]([^'"]+)['"]\)/);
    if(m&&!seen.has(m[1])){seen.add(m[1]);items.push({route:m[1],label:b.textContent.trim(),on:!window._lcCustomPage&&b.classList.contains('on')})}
  });
  const opts=items.map(i=>`<option value="${i.route}" ${i.on?'selected':''}>${i.label}</option>`).join('');
  const mtop=document.querySelector('.mobiletop');
  if(mtop){
    let sel=mtop.querySelector('.lux-top-select');
    if(!sel){
      const children=[...mtop.children];
      const r1=document.createElement('div');r1.className='mobiletop-row1';
      children.forEach(c=>r1.appendChild(c));
      const r2=document.createElement('div');r2.className='lux-menu-wrap';
      r2.innerHTML=`<span>Меню:</span><select class="lux-top-select">${opts}</select>`;
      mtop.appendChild(r1);mtop.appendChild(r2);
      sel=r2.querySelector('select');
      sel.onchange=function(){
        if(this.value==='__tabel__')window.openTabelPage();
        else if(this.value==='__menu__')window.openMenuPage();
        else{window._lcCustomPage=null;window.go(this.value);}
      };
    }else{sel.innerHTML=opts;}
  }
}
function makeFilterBar(onUpdate,withSearch=true){
  const bar=document.createElement('div');bar.className='lux-filter-bar';
  const grades=[['all','Все параллели'],['1','1 класс'],['2','2 класс'],['3','3 класс'],['4','4 класс']];
  bar.innerHTML=`<div class="lux-grade-pills">${grades.map(([g,l])=>`<button type="button" class="lux-gpill ${window._lcGrade===g?'on':''}" data-g="${g}">${l}</button>`).join('')}</div>${withSearch?`<input type="search" class="lux-search" placeholder="🔍 Поиск по имени или классу..." value="${window._lcSearch}">`:''}`;
  bar.querySelectorAll('.lux-gpill').forEach(btn=>{
    btn.onclick=()=>{
      window._lcGrade=btn.dataset.g;
      bar.querySelectorAll('.lux-gpill').forEach(b=>b.classList.toggle('on',b.dataset.g===window._lcGrade));
      onUpdate();
    };
  });
  const inp=bar.querySelector('.lux-search');
  if(inp)inp.oninput=e=>{window._lcSearch=e.target.value.trim().toLowerCase();onUpdate()};
  return bar;
}

/* 3. РОДИТЕЛЬ: Таблица расписания + Меню питания */
function buildParentDayTableHtml(k,dStr,wd){
  const c=window._lcCache;
  const ls=getCleanChildLessonsForDay(k,wd);
  if(!ls.length)return '<div class="empty">В этот день занятий нет</div>';
  const dayObs=c.observations.filter(o=>o.child_id===k.id&&o.observed_on===dStr&&!parseTabelObs(o)&&!(o.tags||[]).includes('__MENU__')&&!(o.tags||[]).includes('__TABEL_DELETED__'));
  let lNum=0;
  const trs=ls.map(l=>{
    const subjObj=c.subjects.find(s=>s.id===l.subject_id);
    const nonC=isNonCountedSubj(subjObj,subjObj?.name||'');
    if(!nonC)lNum++;
    const att=c.attendance.find(a=>a.child_id===k.id&&a.schedule_id===l.id&&a.lesson_date===dStr);
    const lessonConducted=isLessonDone(l.id,dStr);
    let attBadge='<span class="chip">По расписанию</span>';
    if(att?.status==='present'||(!att&&lessonConducted))attBadge='<span class="chip green">✓ Был</span>';
    else if(att?.status==='late')attBadge='<span class="chip yellow">Опоздал</span>';
    else if(att?.status==='absent')attBadge='<span class="chip red">Не был</span>';

    const rec=c.records.find(r=>r.schedule_id===l.id&&r.lesson_date===dStr);
    const topicText=(rec?.topic&&rec.topic!=='Урок проведён')?rec.topic:'';
    const subjObs=dayObs.filter(o=>o.subject_id===l.subject_id);
    const praiseHtml=subjObs.map(o=>`<div style="color:var(--green);font-weight:600;margin-top:2px">✦ ${escH(o.note)}</div>`).join('');

    return `<tr>
      <td style="white-space:nowrap;width:105px"><span class="lux-lnum">${nonC?'Режим':lNum+' урок'}</span><span class="lux-ltime">${String(l.starts_at).slice(0,5)}–${String(l.ends_at).slice(0,5)}</span></td>
      <td><b>${subjObj?.icon||'📘'} ${escH(subjObj?.name||'Предмет')}</b></td>
      <td style="white-space:nowrap">${attBadge}</td>
      <td>${topicText?`<div><b>Тема:</b> ${escH(topicText)}</div>`:''}${praiseHtml||(!topicText?'<span style="color:var(--muted);font-size:11.5px">—</span>':'')}</td>
    </tr>`;
  }).join('');
  return `<div class="table"><table><thead><tr><th>Урок / Время</th><th>Предмет</th><th>Отметка</th><th>Что делали / Успехи ребёнка</th></tr></thead><tbody>${trs}</tbody></table></div>`;
}

/* 4. Фильтрация предметов в окне "+ Наблюдение" + живой ПОИСК во всех модальных окнах */
function enhanceModalsWithSearchAndFilter(){
  const modal=document.querySelector('.modal');
  if(!modal||modal.dataset.enhanced)return;
  modal.dataset.enhanced='1';
  const title=modal.querySelector('.mh h2')?.textContent.trim()||'';
  const c=window._lcCache;

  if(title==='Новое наблюдение'&&getActiveRole()==='teacher'&&c.me){
    const subjSel=modal.querySelector('select[name="subjectId"]');
    if(subjSel){
      const mySubjIds=new Set(c.schedule.filter(l=>l.active&&l.teacher_id===c.me.id).map(l=>l.subject_id));
      [...subjSel.options].forEach(opt=>{
        const sObj=c.subjects.find(s=>s.id===opt.value);
        const isRoutine=sObj&&(['circle','breakfast','lunch','snack','extended','break'].includes(sObj.code)||/круг|завтрак|обед|полдник|продлёнка|перемена/i.test(sObj.name));
        if(!isRoutine&&!mySubjIds.has(opt.value))opt.remove();
      });
    }
  }

  const childSel=modal.querySelector('select[name="childId"]');
  if(childSel&&childSel.options.length>4){
    const allOpts=[...childSel.options].map(o=>({val:o.value,text:o.text,selected:o.selected}));
    const searchInp=document.createElement('input');
    searchInp.type='search';
    searchInp.placeholder='🔍 Быстрый поиск ребёнка по имени или классу...';
    searchInp.style.marginBottom='6px';
    searchInp.oninput=()=>{
      const q=searchInp.value.trim().toLowerCase();
      const curVal=childSel.value;
      childSel.innerHTML='';
      allOpts.filter(o=>!q||o.text.toLowerCase().includes(q)).forEach(o=>{
        const opt=new Option(o.text,o.val,false,o.val===curVal);
        childSel.add(opt);
      });
    };
    childSel.before(searchInp);
  }

  const checkBoxContainer=modal.querySelector('.box');
  const checks=checkBoxContainer?[...checkBoxContainer.querySelectorAll('label')]:[];
  if(checks.length>4){
    const searchInp=document.createElement('input');
    searchInp.type='search';
    searchInp.placeholder='🔍 Поиск ребёнка в списке...';
    searchInp.style.marginBottom='8px';
    searchInp.oninput=()=>{
      const q=searchInp.value.trim().toLowerCase();
      checks.forEach(lbl=>{lbl.style.display=(!q||lbl.textContent.toLowerCase().includes(q))?'flex':'none'});
    };
    checkBoxContainer.before(searchInp);
  }
}

  box.querySelectorAll('.lux-gpill[data-p]').forEach(b=>b.onclick=()=>setPreset(b.dataset.p));

function upgradeAdminSchedule(){
  if(getActiveRole()!=='admin')return;
  const h1=document.querySelector('.main .top h1')?.textContent.trim()||'';
  if(h1!=='Расписание'||!window._lcCache.ready)return;
  let wrap=document.querySelector('.main .lux-matrix-wrap');
  const oldGrid=document.querySelector('.main > .grid.g2');
  if(!wrap){
    wrap=document.createElement('div');wrap.className='lux-matrix-wrap';
    if(oldGrid)oldGrid.replaceWith(wrap);
    else document.querySelector('.main').appendChild(wrap);
  }
  const mon=getMonday(new Date(window._lcSelectedDate+'T12:00:00')),fri=addDays(mon,4);
  const st=calcTeacherStats(null,isoDate(mon),isoDate(fri));
  const daysRu=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const targetSet=new Set(window._lcClasses);
  st.items.forEach(l=>{if(l.target&&l.target!=='Вся школа')targetSet.add(l.target)});
  const cols=sortTargets([...targetSet]);if(!cols.length)cols.push('1','2','3','4');

  const dayTabs=[['all','Вся неделя']];
  for(let i=0;i<5;i++){const dStr=isoDate(addDays(mon,i));dayTabs.push([daysRu[i+1],`${daysRu[i+1]} (${fmtShortDM(dStr)})`]);}

  let html=buildCalendarWidgetHtml(null);
  html+=`<div class="lux-filter-bar"><div class="lux-grade-pills">${dayTabs.map(([k,l])=>`<button type="button" class="lux-gpill ${window._lcSchedDay===k?'on':''}" data-d="${k}">${l}</button>`).join('')}</div></div>`;

  for(let i=0;i<5;i++){
    const dStr=isoDate(addDays(mon,i)),dName=daysRu[i+1];
    if(window._lcSchedDay!=='all'&&window._lcSchedDay!==dName)continue;
    const dayLessons=st.items.filter(x=>x.date===dStr);
    const doneC=dayLessons.filter(x=>!x.nonCount&&x.done).length,planC=dayLessons.filter(x=>!x.nonCount).length;
    if(!dayLessons.length){html+=`<div class="lux-sched-day"><h2>${dName} · ${fmtDateRu(dStr)}</h2><div class="empty">Занятий нет</div></div>`;continue;}
    const slots=[...new Set(dayLessons.map(l=>`${l.start}–${l.end}`))].sort((a,b)=>a.localeCompare(b));
    let lessonNum=0,rowsHtml='';
    slots.forEach(slot=>{
      const slotLessons=dayLessons.filter(l=>`${l.start}–${l.end}`===slot);
      const isOnlyRoutine=slotLessons.every(l=>l.nonCount);
      if(!isOnlyRoutine)lessonNum++;
      const badge=isOnlyRoutine?`<span class="lux-lnum" style="background:var(--gold);color:var(--ink)">Режим</span>`:`<span class="lux-lnum">${lessonNum} урок</span>`;
      const sw=slotLessons.filter(l=>l.target==='Вся школа'),byCol=slotLessons.filter(l=>l.target!=='Вся школа');
      if(sw.length&&!byCol.length){
        const items=sw.map(l=>`<div class="lux-cell-item lux-school-wide" onclick="scheduleModal('${l.scheduleId}')"><strong>${l.icon} ${escH(l.subj)} <span class="chip green">Вся школа</span></strong><small>${escH(l.teacherName)}</small><button type="button" class="lux-cell-del" onclick="archiveSchedule('${l.scheduleId}',event)">×</button></div>`).join('');
        rowsHtml+=`<tr><td class="lux-time-col">${badge}<span class="lux-ltime">${slot}</span></td><td colspan="${cols.length}">${items}</td></tr>`;
      }else{
        const tds=cols.map(c=>{
          const cellLs=slotLessons.filter(l=>l.target===c||l.target==='Вся школа');
          if(!cellLs.length)return `<td></td>`;
          return `<td>${cellLs.map(l=>{
            const statusPill=l.nonCount?'':`<button type="button" class="lux-done-btn ${l.done?'is-done':''}" style="margin-top:4px;padding:3px 8px;font-size:10px" onclick="toggleLessonDone('${l.scheduleId}','${dStr}','${l.teacherId}',event)">${l.done?`✓ ${fmtShortDM(dStr)}`:`○ ${fmtShortDM(dStr)}`}</button>`;
            return `<div class="lux-cell-item" onclick="scheduleModal('${l.scheduleId}')"><strong>${l.icon}${escH(l.subj)}</strong><small>${escH(l.teacherName)}</small>${statusPill}<button type="button" class="lux-cell-del" onclick="archiveSchedule('${l.scheduleId}',event)">×</button></div>`;
          }).join('')}</td>`;
        }).join('');
        rowsHtml+=`<tr><td class="lux-time-col">${badge}<span class="lux-ltime">${slot}</span></td>${tds}</tr>`;
      }
    });
    html+=`<div class="lux-sched-day"><div class="sh"><div><h2>${dName} · ${fmtDateRu(dStr)}</h2></div><span class="chip ${doneC===planC&&planC>0?'green':'yellow'}">${doneC}/${planC} ч</span></div><div class="table"><table class="lux-sched-table"><thead><tr><th>№ / Время</th>${cols.map(c=>`<th>${/^[1-4]$/.test(c)?c+' класс':escH(c)}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div></div>`;
  }
  wrap.innerHTML=html;
  wrap.querySelectorAll('.lux-gpill[data-d]').forEach(b=>b.onclick=()=>{window._lcSchedDay=b.dataset.d;upgradeAdminSchedule()});
}

 for(const s of subjectsDefault){const category=['breakfast','lunch','snack'].includes(s.code)?'meal':['circle','break','extended'].includes(s.code)?'routine':'lesson';const {error}=await sb.from('subjects').upsert({school_id:schoolId,code:s.code,name:s.name,icon:s.icon,category,active:true},{onConflict:'school_id,code',ignoreDuplicates:true});if(error)throw error}
 const rows=await query('subjects','id,school_id,code,name,icon,category,active');db.subjects=rows.map(s=>({id:s.id,schoolId:s.school_id,code:s.code,name:s.name,icon:s.icon||'📘',category:s.category||'lesson',active:s.active}));

function page(){let r=user().role;if(r==='admin')return ({dashboard:adDash,classes:adClasses,children:adChildren,teachers:adTeachers,parents:adParents,users:adUsers,subjects:adSubjects,groups:adGroups,schedule:adSchedule,reports:adReports}[route]||adDash)();if(r==='teacher')return ({today:tToday,notes:tNotes,feedback:tFeedback,schedule:tSchedule}[route]||tToday)();return ({home:pHome,week:pWeek,calendar:pCalendar,schedule:pSchedule}[route]||pHome)()}
function metric(a,b,c){return `<div class="card metric"><small>${a}</small><b>${b}</b><span>${c}</span></div>`}
function subFor(scheduleId,date){return db.substitutions.find(x=>x.scheduleId===scheduleId&&x.date===date)}
function effectiveTeacherId(scheduleId,date=iso()){let l=db.schedule.find(x=>x.id===scheduleId),r=subFor(scheduleId,date);return r?.substituteTeacherId||l?.teacherId}
function effectiveLessons(date=iso(),teacherId=null){let wd=new Date(date+'T12:00:00').getDay();return db.schedule.filter(x=>x.active&&x.weekday===wd&&(!teacherId||effectiveTeacherId(x.id,date)===teacherId)).sort((a,b)=>a.start.localeCompare(b.start))}
function lessonMinutes(l){let [sh,sm]=String(l.start).split(':').map(Number),[eh,em]=String(l.end).split(':').map(Number);return Math.max(0,(eh*60+em)-(sh*60+sm))}
function workedMinutes(teacherId,start=iso(monday()),end=iso(add(monday(),4))){let mins=0,seen=new Set();for(let i=0;i<5;i++){let d=iso(add(monday(),i));if(d<start||d>end)continue;for(const l of db.schedule.filter(x=>x.active)){if(effectiveTeacherId(l.id,d)!==teacherId)continue;let done=db.attendance.some(a=>a.scheduleId===l.id&&a.date===d)||db.lessonRecords.some(x=>x.scheduleId===l.id&&x.date===d);if(done&&!seen.has(l.id+'|'+d)){mins+=lessonMinutes(l);seen.add(l.id+'|'+d)}}}return mins}
function fmtHours(mins){let h=Math.floor(mins/60),m=mins%60;return m?`${h} ч ${m} мин`:`${h} ч`}
function lessonRecord(scheduleId,date=iso()){return db.lessonRecords.find(x=>x.scheduleId===scheduleId&&x.date===date)}
function groupName(id){return db.groups.find(g=>g.id===id)?.name||''}
function targetName(l){return l.audienceType==='school'?'Вся школа':l.audienceType==='aftercare'?'Продлёнка':l.audienceType==='group'?groupName(l.groupId):cls(l.classId)?.name||'Класс не выбран'}
function childrenForLesson(l){if(l.audienceType==='school')return db.children.filter(k=>k.active);if(l.audienceType==='aftercare')return db.children.filter(k=>k.active&&k.aftercareActive);if(l.audienceType==='group')return db.children.filter(k=>k.active&&db.childGroups.some(x=>x.child_id===k.id&&x.group_id===l.groupId));return db.children.filter(k=>k.classId===l.classId&&k.active)}
function lessonRow(l,opts={}){let rec=lessonRecord(l.id);return `<div class="row"><span class="time">${l.start}</span><span class="ico">${subIcon(l.subjectId)}</span><div class="rowmain"><strong>${esc(targetName(l))} · ${esc(sub(l.subjectId).name)}</strong><small>${esc(prof(l.teacherId)?.name||'Педагог')} · ${l.start}–${l.end}${rec?.topic?' · '+esc(rec.topic):''}</small></div>${opts.edit?`<button class="btn soft" onclick="scheduleModal('${l.id}')">Изменить</button>`:''}</div>`}
function obsRow(o){return `<div class="row"><span class="avatar">${initials(kid(o.childId)?.name)}</span><div class="rowmain"><strong>${esc(kid(o.childId)?.name||'')} · ${esc(sub(o.subjectId).name)}</strong><small>${esc(o.text)}</small><small>${fmt(o.date,{day:'numeric',month:'short'})} · ${esc(prof(o.teacherId)?.name||'')}</small></div></div>`}
function adDash(){let wd=new Date().getDay(),ls=db.schedule.filter(x=>x.weekday===wd&&x.active).sort((a,b)=>a.start.localeCompare(b.start)),s=iso(monday()),e=iso(add(monday(),4)),obs=db.observations.filter(o=>o.date>=s&&o.date<=e);return top('Дашборд','Вся школа в одном экране.','<button class="btn primary" onclick="scheduleModal()">+ Занятие</button>')+`<div class="grid g4">${metric('Классы',db.classes.filter(x=>x.active).length,'активные классы')}${metric('Дети',db.children.filter(x=>x.active).length,'зачислены')}${metric('Педагоги',db.profiles.filter(x=>x.role==='teacher'&&x.active).length,'с отдельным входом')}${metric('Наблюдения',obs.length,'за эту неделю')}</div><section class="section grid g2"><div class="card"><div class="sh"><div><h2>Занятия сегодня</h2><p>${days[wd]}</p></div></div>${ls.length?'<div class="list">'+ls.map(l=>lessonRow(l)).join('')+'</div>':'<div class="empty">Сегодня занятий нет.</div>'}</div><div class="card"><div class="sh"><div><h2>Последние наблюдения</h2><p>Что замечают педагоги</p></div></div><div class="list">${db.observations.slice().reverse().slice(0,5).map(obsRow).join('')||'<div class="empty">Пока нет наблюдений.</div>'}</div></div></section>`}
function adSubjects(){let active=db.subjects.filter(s=>s.active),arch=db.subjects.filter(s=>!s.active);return top('Предметы и активности','Добавляй школьные предметы, элективы и события питания без изменения кода.','<button class="btn primary" onclick="subjectModal()">+ Добавить предмет</button>')+`<div class="grid g3">${active.map(s=>`<div class="card"><div class="row" style="border:0;padding:0;background:transparent"><span class="ico">${subIcon(s)}</span><div class="rowmain"><strong>${esc(s.name)}</strong><small>${esc(s.code)}</small></div><button class="btn soft" onclick="subjectModal('${s.id}')">Изменить</button></div></div>`).join('')||'<div class="empty">Предметов пока нет</div>'}</div>${arch.length?`<section class="section"><h2>Архив</h2><div class="grid g3">${arch.map(s=>`<div class="card"><div class="rowmain"><strong>${esc(s.name)}</strong><button class="btn soft" onclick="restoreSubject('${s.id}')">Вернуть</button></div></div>`).join('')}</div></section>`:''}`}

window.saveParent=async e=>{
 e.preventDefault();let f=new FormData(e.target),id=f.get('id'),name=f.get('name').trim(),active=f.get('active')==='true',childIds=f.getAll('children');

 let login=f.get('login').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');if(login.length<3)return toast('Логин: минимум 3 латинских символа');let password=f.get('password'),email=login+'@littleclan.local';

 let res=await authSb.auth.signUp({email,password}),uid=res.data?.user?.id;
 if(res.error){if(/already registered|already exists|user already registered/i.test(res.error.message)){let sign=await authSb.auth.signInWithPassword({email,password});if(sign.error)return toast('Такой аккаунт уже есть, но пароль не подошёл.');uid=sign.data?.user?.id}else{return toast('Не удалось создать аккаунт: '+res.error.message)}}
 if(!uid)return toast('Аккаунт не создан. Проверь настройки Email в Supabase.');

 let existing=await sb.from('profiles').select('id,role,school_id').eq('id',uid).maybeSingle();if(existing.error)return toast('Не удалось проверить профиль: '+existing.error.message);if(existing.data&&existing.data.role!=='parent')return toast('Этот аккаунт уже используется с другой ролью: '+roleName[existing.data.role]);
 let pr=await sb.from('profiles').upsert({id:uid,school_id:schoolId,role:'parent',full_name:name,active},{onConflict:'id'});if(pr.error)return toast('Аккаунт найден, но профиль не добавился: '+pr.error.message);
 let del=await sb.from('child_parents').delete().eq('parent_id',uid);if(del.error)return toast('Профиль создан, но старые привязки не обновились: '+del.error.message);if(childIds.length){let lr=await sb.from('child_parents').insert(childIds.map(cid=>({child_id:cid,parent_id:uid,relation_label:'Родитель'})));if(lr.error)return toast('Родитель создан, но дети не привязались: '+lr.error.message)}
 closeModal();await refresh();toast('Родитель создан. Логин: '+login);
};

const pdfStyle=`@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');@page{size:A4;margin:14mm}body{font-family:'Plus Jakarta Sans',sans-serif;color:#1C221C;background:#FFFDF9;padding:18px;border:1px solid #C5A572;outline:1px solid rgba(197,165,114,.35);outline-offset:-6px}.lux-svg{width:16px;height:16px;stroke:#1E3124;stroke-width:1.5;fill:none;vertical-align:-2px;margin-right:4px}.head{border-bottom:1.5px solid #C5A572;padding-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}.brand{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:#1E3124}h1{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;margin:22px 0 4px;color:#1C221C}h2,h3{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;margin:0 0 8px;color:#1E3124}.muted{color:#6E6A63;font-size:12px}.box{border:1px solid #DFD5C5;background:#FAF7F2;border-radius:14px;padding:15px 18px;margin:12px 0;break-inside:avoid}.box p{line-height:1.6;font-size:12.5px;margin:6px 0}.box p b{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6E6A63}.tag{display:inline-block;padding:5px 10px;background:#E9EFE8;color:#1E3124;border:1px solid rgba(58,82,63,.2);border-radius:99px;margin:3px;font-size:11px;font-weight:600}.foot{margin-top:28px;border-top:1px solid #DFD5C5;padding-top:12px;color:#6E6A63;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;text-align:center}`;
window.feedbackPdf=(kidId,fid)=>{let k=kid(kidId),f=db.feedbackReports.find(x=>x.id===fid);if(!k||!f)return toast('Отчёт не найден');let doc=`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Little Clan — ${esc(k.name)}</title><style>${pdfStyle}</style></head><body>${feedbackHtml(k,f)}<script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`;let w=window.open('','_blank');if(!w)return toast('Разрешите всплывающие окна');w.document.write(doc);w.document.close();toast('В окне печати выберите «Сохранить как PDF»')};
