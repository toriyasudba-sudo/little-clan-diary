.empty{text-align:center;padding:25px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:rgba(255,255,255,.45)}
.modalbg{position:fixed;inset:0;background:rgba(28,34,27,.4);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:15px}.modal{width:min(580px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.22)}.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.mh h2{margin:0;font-size:19px}.x{width:32px;height:32px;border-radius:50%;border:0;background:#eee8dd;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.tagbtn{padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:11px;font-weight:800;cursor:pointer}.tagbtn.on{background:var(--soft);color:var(--green);border-color:#bbc8ad}
.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:#273024;color:white;padding:11px 13px;border-radius:12px;box-shadow:0 14px 35px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);transition:.2s;font-size:12px;max-width:350px}.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.loginbox{grid-template-columns:1fr}.hero h1{margin-top:30px}}

@media print{.side,.mobilenav,.mobiletop,.topright,.noprint{display:none!important}.layout{display:block}.main{padding:0}.card{box-shadow:none}}

<script>
(()=>{
const SUPABASE_URL='https://pqzgbhlkodsslykombsv.supabase.co';
const SUPABASE_VAPID_PUBLIC_KEY='BMDdNgbVhUwdnZo74rViJGt1VM1jWUfdFW9tKWS7ZwWwsPm4nfvTCYzb8Mob7rW3N48VVXuU3Huhk8Ty9XWF4zY';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_d9Rf6xNSups9x8Fyz4W-Og_t0Oy4m1Y';
const SESSION='lc_supabase_session_v1';
const subjectsDefault=[['rus','Русский язык','📖'],['math','Математика','➗'],['world','Окружающий мир','🌿'],['art','ИЗО','🎨'],['pe','Физическая культура','🏃'],['music','Музыка','🎵'],['eng','Английский язык','🔤'],['after','Продлёнка','🧩']].map(x=>({code:x[0],name:x[1],icon:x[2]}));
const tags=['Мышление','Коммуникация','Самостоятельность','Инициатива','Творчество','Внимательность','Командная работа'];
const days=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
let db={school:null,profiles:[],classes:[],subjects:[],children:[],parentLinks:[],schedule:[],observations:[],attendance:[]};
let session=null,route=null,lessonOpen=null;
let sb=null;
function id(p){return p+'_'+Math.random().toString(36).slice(2,9)}
function iso(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d=new Date()){let x=new Date(d),k=x.getDay()||7;x.setHours(12,0,0,0);x.setDate(x.getDate()-k+1);return x}
function fmt(d,o={day:'numeric',month:'long'}){return new Intl.DateTimeFormat('ru-RU',o).format(new Date(d))}
function week(){let s=monday(),e=add(s,4);return fmt(s,{day:'numeric'})+'–'+fmt(e,{day:'numeric',month:'long'})}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function initials(s=''){return s.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function sub(i){return db.subjects.find(x=>x.id===i)||{name:'Предмет',icon:'📘'}}
function cls(i){return db.classes.find(x=>x.id===i)}
function kid(i){return db.children.find(x=>x.id===i)}
function prof(i){return db.profiles.find(x=>x.id===i)}
function user(){return session?prof(session.userId):null}
async function loadCurrentProfile(){
  const uid=session?.userId;
  if(!uid) throw new Error('Нет активной сессии');
  const {data:p,error}=await sb.from('profiles').select('id,school_id,role,full_name,active').eq('id',uid).maybeSingle();
  if(error) throw error;
  if(!p) throw new Error('Профиль пользователя не найден');
  db.profiles=[{id:p.id,schoolId:p.school_id,role:p.role,name:p.full_name,active:p.active}];
  return db.profiles[0];
}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),2500)}
function brand(){return '<div class="brand"><div class="logo">🌱</div><div><strong>Little Clan Diary</strong><small>дневник роста ребёнка</small></div></div>'}
const roleName={admin:'Администратор',teacher:'Педагог',parent:'Родитель'};
const navs={admin:[['dashboard','⌂ Дашборд'],['classes','▦ Классы'],['children','◉ Дети'],['teachers','♙ Педагоги'],['schedule','◷ Расписание'],['reports','⇩ PDF']],teacher:[['today','☀ Сегодня'],['notes','✎ Наблюдения'],['schedule','◷ Расписание']],parent:[['home','⌂ Главная'],['week','▤ Неделя'],['calendar','◫ Календарь'],['schedule','◷ Расписание']]};
function def(r){return r==='admin'?'dashboard':r==='teacher'?'today':'home'}
function nav(role){return navs[role].map(n=>`<button class="${route===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}
function notificationButton(){let n=db.notifications.filter(x=>!x.read_at).length;return `<button class="btn ghost" onclick="openNotifications()">🔔${n?` ${n}`:''}</button>`}
function pushButton(){if(!('Notification' in window)||!('serviceWorker' in navigator)||!user())return ''; if(Notification.permission==='granted')return `<button class="btn soft" onclick="enablePush()">🔔 Уведомления включены</button>`; if(Notification.permission==='denied')return ''; return `<button class="btn soft" onclick="enablePush()">🔔 Включить уведомления</button>`}
function top(title,subt,extra=''){return `<div class="top"><div><h1>${title}</h1><p>${subt}</p></div><div class="topright"><span class="badge">${roleName[user().role]}</span><span class="cloud">☁ Данные в Supabase</span>${notificationButton()}${pushButton()}${extra}</div></div>`}
async function query(table, columns='*'){let {data,error}=await sb.from(table).select(columns);if(error)throw error;return data||[]}
async function loadNotifications(){
  try{
    const rows=await query('notifications','id,recipient_id,title,body,type,data,read_at,created_at');
    db.notifications=rows.map(n=>({id:n.id,recipient_id:n.recipient_id,title:n.title,body:n.body,type:n.type,data:n.data||{},read_at:n.read_at,created_at:n.created_at}));
    updateAppBadge();
  }catch(e){db.notifications=[]; console.warn('Notifications table not ready yet:',e.message||e)}
}
function updateAppBadge(){
  const count=db.notifications.filter(x=>!x.read_at).length;
  try{if(count && navigator.setAppBadge) navigator.setAppBadge(count); else if(!count && navigator.clearAppBadge) navigator.clearAppBadge();}catch(e){}
  document.title=count?`(${count}) Little Clan Diary`:'Little Clan Diary';
}
async function registerPwa(){
  if(!('serviceWorker' in navigator))return;
  try{swReg=await navigator.serviceWorker.register('./sw.js',{scope:'./'}); pushReady=true;}catch(e){console.warn('SW registration failed',e)}
}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function savePushSubscription(subscription){
  const json=subscription.toJSON();
  const {error}=await sb.from('push_subscriptions').upsert({user_id:user().id,endpoint:json.endpoint,subscription:json,updated_at:new Date().toISOString()},{onConflict:'endpoint'});
  if(error)throw error;
}
async function enablePush(){
  if(!user()||!swReg)return toast('Приложение ещё запускается');
  if(!('Notification' in window)||!('PushManager' in window))return toast('Уведомления не поддерживаются этим браузером');
  const permission=await Notification.requestPermission();
  if(permission!=='granted')return toast('Разрешение на уведомления не выдано');
  try{
    let sub=await swReg.pushManager.getSubscription();
    if(!sub)sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(SUPABASE_VAPID_PUBLIC_KEY)});
    await savePushSubscription(sub); pushReady=true; render(); toast('Уведомления включены 🔔');
  }catch(e){console.error(e);toast('Не удалось включить уведомления: '+(e.message||e))}
}
async function openNotifications(){
  await loadNotifications();
  const items=db.notifications.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  modal('Уведомления',`<div class="list">${items.length?items.map(n=>`<button type="button" class="row" style="text-align:left;border:1px solid var(--line);cursor:pointer" onclick="markNotification('${n.id}')"><span class="ico">${n.type==='attendance'?'📅':'🌿'}</span><div class="rowmain"><strong>${esc(n.title)}</strong><small>${esc(n.body)}</small><small>${fmt(n.created_at,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${n.read_at?'':' · <b>новое</b>'}</small></div></button>`).join(''):'<div class="empty">Новых сообщений пока нет.</div>'}</div><div class="actions"><button class="btn ghost" onclick="markAllNotifications()">Отметить всё прочитанным</button><button class="btn primary" onclick="closeModal()">Закрыть</button></div>`);
}
window.markNotification=async id=>{const {error}=await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id);if(error)return toast('Ошибка: '+error.message);closeModal();await loadNotifications();render();};
window.markAllNotifications=async()=>{const {error}=await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('recipient_id',user().id).is('read_at',null);if(error)return toast('Ошибка: '+error.message);closeModal();await loadNotifications();render();};
async function loadDb(){
  await loadCurrentProfile();
  const schoolId=user()?.schoolId;

window.classModal=()=>modal('Новый класс',`<form onsubmit="saveClass(event)"><div class="field"><label>Название</label><input name="name" required placeholder="1А"></div><div class="field"><label>Учебный год</label><input name="year" value="2026/27"></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary">Создать</button></div></form>`);
window.saveClass=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('classes').insert({school_id:user().schoolId,name:f.get('name'),school_year:f.get('year'),active:true});if(error)return toast('Ошибка: '+error.message);closeModal();await refresh();toast('Класс создан')};
window.childModal=()=>{if(!db.classes.length)return toast('Сначала создайте класс');modal('Добавить ребёнка',`<form onsubmit="saveChild(event)"><div class="formgrid"><div class="field"><label>Фамилия</label><input name="last" required></div><div class="field"><label>Имя</label><input name="first" required></div></div><div class="field"><label>Класс</label><select name="classId">${db.classes.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary">Добавить</button></div></form>`)};
window.saveChild=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('children').insert({school_id:user().schoolId,class_id:f.get('classId'),first_name:f.get('first'),last_name:f.get('last'),active:true});if(error)return toast('Ошибка: '+error.message);closeModal();await refresh();toast('Ребёнок добавлен')};
window.scheduleModal=()=>{if(!db.classes.length||!db.subjects.length)return toast('Сначала создайте класс');let teachers=db.profiles.filter(x=>x.role==='teacher'&&x.active);if(!teachers.length)return toast('Сначала создайте профиль педагога');modal('Новое занятие',`<form onsubmit="saveSchedule(event)"><div class="formgrid"><div class="field"><label>Класс</label><select name="classId">${db.classes.filter(c=>c.active).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Предмет</label><select name="subjectId">${db.subjects.filter(s=>s.active).map(s=>`<option value="${s.id}">${s.icon} ${esc(s.name)}</option>`).join('')}</select></div></div><div class="field"><label>Педагог</label><select name="teacherId">${teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>День</label><select name="weekday">${[1,2,3,4,5].map(d=>`<option value="${d}">${days[d]}</option>`).join('')}</select></div><div class="field"><label>Время</label><div style="display:flex;gap:6px"><input name="start" type="time" value="09:00"><input name="end" type="time" value="09:40"></div></div></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary">Добавить</button></div></form>`)};
window.saveSchedule=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from('schedule').insert({school_id:user().schoolId,class_id:f.get('classId'),subject_id:f.get('subjectId'),teacher_id:f.get('teacherId'),weekday:Number(f.get('weekday')),starts_at:f.get('start'),ends_at:f.get('end'),active:true});if(error)return toast('Ошибка: '+error.message);closeModal();await refresh();toast('Занятие добавлено')};
window.noteModal=(sid='',kidid='')=>{let l=sid?db.schedule.find(x=>x.id===sid):null;let ks=l?db.children.filter(k=>k.classId===l.classId&&k.active):db.children.filter(k=>k.active);if(!ks.length)return toast('Нет доступных детей');modal('Новое наблюдение',`<form onsubmit="saveNote(event)"><div class="field"><label>Ребёнок</label><select name="childId">${ks.map(k=>`<option value="${k.id}" ${k.id===kidid?'selected':''}>${esc(k.name)} · ${esc(cls(k.classId)?.name||'')}</option>`).join('')}</select></div><div class="field"><label>Предмет</label><select name="subjectId">${db.subjects.map(s=>`<option value="${s.id}" ${s.id===l?.subjectId?'selected':''}>${s.icon} ${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Быстрые теги</label><div class="chips" id="tagpick">${tags.map(t=>`<button type="button" class="tagbtn" data-tag="${t}" onclick="this.classList.toggle('on')">${t}</button>`).join('')}</div></div><div class="field"><label>Заметка</label><textarea name="text" required placeholder="Что конкретно произошло на уроке или в течение дня?"></textarea></div><div class="actions"><button type="button" class="btn ghost" onclick="closeModal()">Отмена</button><button class="btn primary">Сохранить</button></div></form>`)};
window.saveNote=async e=>{e.preventDefault();let f=new FormData(e.target),ts=[...document.querySelectorAll('#tagpick .on')].map(x=>x.dataset.tag);let {error}=await sb.from('observations').insert({school_id:user().schoolId,child_id:f.get('childId'),teacher_id:user().id,subject_id:f.get('subjectId'),observed_on:iso(),note:f.get('text'),tags:ts});if(error)return toast('Ошибка: '+error.message);closeModal();await refresh();toast('Наблюдение сохранено')};
window.openLesson=sid=>{lessonOpen=sid;render();setTimeout(()=>document.querySelector('.section.card')?.scrollIntoView({behavior:'smooth'}),50)};window.closeLesson=()=>{lessonOpen=null;render()};
window.attend=async(sid,kidid,st)=>{let {error}=await sb.from('attendance').upsert({school_id:user().schoolId,child_id:kidid,schedule_id:sid,lesson_date:iso(),status:st,marked_by:user().id},{onConflict:'child_id,schedule_id,lesson_date'});if(error)return toast('Ошибка: '+error.message);await refresh()};
window.report=kidid=>{let k=kid(kidid),s=iso(monday()),e=iso(add(monday(),6)),o=db.observations.filter(x=>x.childId===k.id&&x.date>=s&&x.date<=e),a=db.attendance.filter(x=>x.childId===k.id&&x.date>=s&&x.date<=e),cnt={};o.forEach(x=>x.tags.forEach(t=>cnt[t]=(cnt[t]||0)+1));let tops=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]),labels={present:'Был',late:'Опоздал',absent:'Отсутствовал'};let doc=`<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Little Clan — ${esc(k.name)}</title><style>@page{size:A4;margin:16mm}body{font-family:Arial,sans-serif;color:#263024}.head{border-bottom:3px solid #516342;padding-bottom:15px}.brand{font-size:22px;font-weight:800;color:#516342}h1{font-size:30px;margin:24px 0 5px}.muted{color:#71776c}.box{border:1px solid #ddd3c4;border-radius:14px;padding:15px;margin:11px 0;break-inside:avoid}.tag{display:inline-block;padding:5px 8px;background:#e7edde;color:#516342;border-radius:99px;margin:3px;font-size:11px}.box h3{margin:0 0 6px;font-size:14px}.box p{line-height:1.5}.foot{margin-top:28px;border-top:1px solid #ddd3c4;padding-top:14px;color:#71776c;font-size:10px}</style></head><body><div class="head"><div class="brand">🌿 Little Clan Diary</div><div class="muted">дневник роста ребёнка · ${week()}</div></div><h1>Неделя ${esc(k.first)}</h1><div class="muted">${esc(k.name)} · ${esc(cls(k.classId)?.name||'')}</div><div class="box"><b>Области, которые чаще замечали педагоги</b><div>${tops.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<span class="tag">Пока мало наблюдений</span>'}</div></div><div class="box"><b>Посещаемость</b><p>${a.map(x=>fmt(x.date,{day:'numeric',month:'short'})+': '+labels[x.status]).join(' · ')||'Отметок пока нет.'}</p></div>${o.map(x=>`<div class="box"><h3>${sub(x.subjectId).icon} ${esc(sub(x.subjectId).name)}</h3><p>${esc(x.text)}</p><div>${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="muted" style="font-size:10px;margin-top:7px">${fmt(x.date,{day:'numeric',month:'long'})} · ${esc(prof(x.teacherId)?.name||'Педагог')}</div></div>`).join('')||'<div class="box">На этой неделе записей пока нет.</div>'}<div class="foot">Little Clan · без оценок и сравнений. Отчёт собран из наблюдений педагогов за выбранную неделю.</div><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script></body></html>`;let w=window.open('','_blank');if(!w){toast('Разрешите всплывающие окна');return}w.document.write(doc);w.document.close();toast('В окне печати выберите «Сохранить как PDF»')};
window.doLogin=async e=>{e.preventDefault();let mail=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;let {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass});if(error)return toast('Не удалось войти: '+error.message);session={userId:data.user.id};sessionStorage.setItem(SESSION,JSON.stringify(session));try{await loadDb();await loadNotifications();route=def(user().role);render()}catch(err){await sb.auth.signOut();session=null;toast('Аккаунт не привязан к школе: '+err.message)}};
window.logout=async()=>{await sb.auth.signOut();session=null;route=null;lessonOpen=null;sessionStorage.removeItem(SESSION);render()};window.go=r=>{route=r;lessonOpen=null;render();window.scrollTo({top:0,behavior:'smooth'})};
async function boot(){
  const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  sb=mod.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:{session:authSession}}=await sb.auth.getSession();
  if(authSession){session={userId:authSession.user.id};try{await loadDb();await loadNotifications();route=def(user().role)}catch(e){await sb.auth.signOut();session=null;toast('Не удалось загрузить профиль: '+e.message)}}
  sb.auth.onAuthStateChange(async (_event,s)=>{if(!s){session=null;db.notifications=[];updateAppBadge();sessionStorage.removeItem(SESSION);render()} else {session={userId:s.user.id};try{await loadDb();await loadNotifications();route=def(user().role);render()}catch(e){console.warn(e)}}});
  await registerPwa();
  render();
}
boot().catch(e=>{console.error(e);document.getElementById('app').innerHTML='<div class="login"><section class="loginbox"><div class="loginform"><h2>Не удалось запустить дневник</h2><p>Проверьте интернет-соединение и настройки Supabase.</p><pre style="white-space:pre-wrap;color:#a33">'+esc(e.message||e)+'</pre></div></section></div>'});
})();
</script>
</body>
</html>
