<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Little Clan Diary — Семейная хроника роста</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE6;--bg-top:#FAF7F2;--card:#FFFDF9;--ink:#1C221C;--muted:#6E6A63;
  --green:#1E3124;--green2:#3A523F;--soft:#E9EFE8;--line:#DFD5C5;
  --gold:#C5A572;--goldSoft:rgba(197,165,114,.28);
  --orange:#B85D3B;--orangeSoft:#F6E6DE;--yellow:#B88928;--yellowSoft:#F9F0DA;
  --red:#9E4740;--redSoft:#F4E1DF;
  --shadow:0 18px 44px -12px rgba(28,34,28,.08);
  --shadow-card:0 10px 28px -8px rgba(30,25,20,.05);
  --font-serif:'Cormorant Garamond',Georgia,serif;
  --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh;overflow-x:hidden;overflow-y:auto!important;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,var(--bg-top),var(--bg));color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#243829,#162419);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);box-shadow:0 6px 18px rgba(22,36,25,.16);flex:0 0 auto;font-size:20px}
.brand strong{display:block;font-family:var(--font-serif);font-size:20px;font-weight:700;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-top:2px}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 12% 18%,rgba(197,165,114,.16) 0,transparent 38%)}
.loginbox{width:min(980px,100%);display:grid;grid-template-columns:1.1fr .9fr;border:1px solid var(--goldSoft);border-radius:28px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.hero{padding:44px;background:linear-gradient(145deg,#FAF5EC,#EFECE4);border-right:1px solid var(--line)}
.hero h1{font-family:var(--font-serif);font-size:clamp(36px,5vw,60px);font-weight:600;line-height:.98;margin:32px 0 18px}
.hero h1 span{color:var(--green);font-style:italic}
.hero p{font-size:15.5px;color:var(--muted);line-height:1.65}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pill{padding:8px 13px;border:1px solid rgba(197,165,114,.38);background:#FFFDF9;border-radius:99px;font-size:11px;font-weight:600}
.loginform{padding:40px;display:flex;flex-direction:column;justify-content:center}
.loginform h2{margin:0 0 6px;font-family:var(--font-serif);font-size:32px;font-weight:600}
.loginform>p{margin:0 0 20px;color:var(--muted);font-size:14px}
.field{display:grid;gap:6px;margin-bottom:13px}
.field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#FFFDF9;color:var(--ink);outline:none;font-size:14px}
textarea{min-height:96px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(197,165,114,.16)}
.btn{border:0;border-radius:99px;padding:9px 15px;font-weight:600;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.primary{background:linear-gradient(145deg,#243829,#18271C);color:#FAF7F2;border:1px solid rgba(197,165,114,.45)}
.soft{background:var(--soft);color:var(--green);border:1px solid rgba(58,82,63,.15)}
.ghost{background:#FFFDF9;border:1px solid var(--line);color:var(--ink)}
.wide{width:100%}
.demo{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;background:linear-gradient(180deg,#1A281E,#141F17);color:#FAF7F2;display:flex;flex-direction:column;gap:16px;border-right:1px solid rgba(197,165,114,.25)}
.side .brand strong{color:#FAF7F2}.side .brand small{color:var(--gold)}
.nav{display:grid;gap:4px;overflow-y:auto}
.nav button{border:1px solid transparent;background:transparent;color:rgba(250,247,242,.72);padding:10px 12px;border-radius:12px;text-align:left;font-weight:500;font-size:13px;cursor:pointer}
.nav button.on{background:rgba(197,165,114,.18);color:#FFFDF9;border-color:rgba(197,165,114,.38);font-weight:600}
.spacer{flex:1}
.me{padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(197,165,114,.2)}
.me strong{font-family:var(--font-serif);font-size:16px;color:#FFFDF9;display:block}
.me small{display:block;color:var(--gold);margin-top:2px;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.logout{width:100%;margin-top:6px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)}
.main{min-width:0;padding:26px clamp(14px,3vw,36px) 60px;max-width:1360px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(197,165,114,.28);flex-wrap:wrap}
.top h1{margin:0 0 4px;font-family:var(--font-serif);font-size:clamp(28px,3.4vw,40px);font-weight:600;line-height:1.08}
.top p{margin:0;color:var(--muted);font-size:13px}
.topright{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{padding:6px 11px;border-radius:99px;background:#F3ECE0;border:1px solid var(--gold);color:var(--ink);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid rgba(197,165,114,.28);border-radius:22px;padding:18px;box-shadow:var(--shadow-card);min-width:0}
.metric{background:linear-gradient(160deg,#FFFDF9,#FAF5EC);outline:1px solid rgba(197,165,114,.15);outline-offset:-5px}
.metric small{color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.metric b{display:block;font-family:var(--font-serif);font-size:40px;font-weight:600;line-height:1;margin-top:8px;color:var(--green)}
.metric span{display:block;color:var(--muted);margin-top:6px;font-style:italic;font-family:var(--font-serif);font-size:15px}
.section{margin-top:18px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sh h2,.sh h3{margin:0;font-family:var(--font-serif);font-size:22px;font-weight:600}
.sh p{margin:2px 0 0;color:var(--muted);font-size:12px}
.list{display:grid;gap:9px;min-width:0}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#FFFDF9;flex-wrap:wrap;min-width:0}
.rowmain{flex:1 1 160px;min-width:0}
.rowmain strong{display:block;font-size:14px;font-weight:600;line-height:1.3}
.rowmain small{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.45}
.time{padding:5px 10px;border-radius:9px;background:#F6F1E7;border:1px solid rgba(197,165,114,.35);color:var(--green);font-family:var(--font-serif);font-weight:700;font-size:13px;white-space:nowrap}
.ico{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:#F6EFE2;border:1px solid rgba(197,165,114,.35);font-size:17px;flex:0 0 auto}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#243829,#17251B);color:#F6EFE2;border:1.5px solid var(--gold);font-family:var(--font-serif);font-size:14px;font-weight:600;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;background:#F2ECE1;border:1px solid rgba(197,165,114,.24);font-size:11px;font-weight:600;white-space:nowrap}
.green{background:var(--soft);color:var(--green)}.yellow{background:var(--yellowSoft);color:#7D5B14}.red{background:var(--redSoft);color:var(--red)}.orange{background:var(--orangeSoft);color:var(--orange)}
.box{background:#FAF6EE;border:1px solid rgba(197,165,114,.35);border-radius:16px;padding:15px 17px;margin-top:12px}
.box h3{margin:0 0 8px;font-family:var(--font-serif);font-size:19px;font-weight:600;color:var(--green);border-bottom:1px solid rgba(197,165,114,.2);padding-bottom:6px}
.box p{margin:6px 0;font-size:13.5px;line-height:1.55}
.table{overflow-x:auto;border:1px solid rgba(197,165,114,.28);border-radius:16px;background:#FFFDF9;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;border-bottom:1px solid #EFE8DC;text-align:left;font-size:13px;vertical-align:middle}
th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#F8F3EA;font-weight:700}
tr:last-child td{border-bottom:0}
.attrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EFE8DC;flex-wrap:wrap}
.attrow:last-child{border-bottom:0}
.attactions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.att{padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#FFFDF9;font-size:11.5px;font-weight:700;cursor:pointer}
.att.on.present{background:var(--green);color:#FAF7F2;border-color:var(--gold)}
.att.on.late{background:var(--yellow);color:#fff;border-color:var(--yellow)}
.att.on.absent{background:var(--red);color:#fff;border-color:var(--red)}
.herochild{display:flex;align-items:center;gap:14px;padding:18px 20px;border:1px solid rgba(197,165,114,.4);border-radius:22px;background:linear-gradient(135deg,#F6F1E6,#EAEFE8)}
.herochild .avatar{width:52px;height:52px;font-size:20px}
.herochild h2{margin:0;font-family:var(--font-serif);font-size:26px}.herochild p{margin:3px 0 0;color:var(--muted);font-size:13px}
.feed{display:grid;gap:10px}
.feeditem{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:15px;border:1px solid rgba(197,165,114,.3);border-radius:18px;background:#FFFDF9}
.feeditem h3{margin:0;font-family:var(--font-serif);font-size:18px}.feeditem p{margin:5px 0 8px;line-height:1.55;font-size:13.5px;white-space:pre-wrap}.feeditem footer{color:var(--muted);margin-top:6px;font-style:italic;font-family:var(--font-serif);font-size:13px}
.calendar{padding:18px;background:var(--card);border:1px solid rgba(197,165,114,.3);border-radius:20px}
.calhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.calhead b{font-family:var(--font-serif);font-size:21px;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;color:var(--muted);font-size:10px;font-weight:700}
.day{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#F8F4EC;font-family:var(--font-serif);font-size:14px;font-weight:600;position:relative;cursor:pointer;border:1px solid transparent}
.day:hover{border-color:var(--gold);background:#EFE6D5}
.day.sel{border:2px solid var(--green)!important;background:#E9EFE8!important;font-weight:700}
.day.present:after,.day.late:after,.day.absent:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;bottom:3px}
.day.present:after{background:var(--green2)}.day.late:after{background:var(--yellow)}.day.absent:after{background:var(--red)}
.day.today{background:var(--green);color:#FFFDF9;border:1px solid var(--gold)}
.empty{text-align:center;padding:24px;color:var(--muted);border:1px dashed rgba(197,165,114,.45);border-radius:16px;background:rgba(255,253,249,.6);font-family:var(--font-serif);font-style:italic;font-size:16px}
.modalbg{position:fixed;inset:0;background:rgba(20,26,20,.55);z-index:80;display:grid;place-items:center;padding:12px;overflow-y:auto}
.modal{width:min(650px,100%);max-height:90vh;overflow-y:auto;background:var(--card);border:1px solid var(--gold);border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-family:var(--font-serif);font-size:24px}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#F7F2E8;cursor:pointer;font-size:18px;flex:0 0 auto}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.tagbtn{padding:6px 11px;border:1px solid var(--line);background:#FFFDF9;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer}
.tagbtn.on{background:var(--green);color:#FFFDF9;border-color:var(--gold)}
.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:#1E2D22;color:#FAF7F2;border:1px solid var(--gold);padding:12px 16px;border-radius:14px;opacity:0;transform:translateY(10px);transition:.2s;font-size:12px;max-width:340px;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* Карточки уроков, многострочное ДЗ, Меню питания и Табель */
.mobiletop{display:none}
.lux-menu-wrap{display:flex;align-items:center;gap:8px;background:#FAF5EC;border:1px solid var(--gold);border-radius:13px;padding:3px 11px;width:100%}
.lux-menu-wrap span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.lux-top-select{border:0!important;background:transparent!important;padding:6px 2px!important;font-weight:700;font-size:13.5px!important;color:var(--green)!important;cursor:pointer;width:100%}
.lux-filter-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:14px;background:linear-gradient(145deg,#FFFDF9,#F6F0E4);border:1px solid rgba(197,165,114,.38);border-radius:16px}
.lux-grade-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lux-gpill{border:1px solid var(--line);background:#FFFDF9;color:var(--ink);padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:600;cursor:pointer}
.lux-gpill.on{background:var(--green);color:#FAF7F2;border-color:var(--gold)}
.lux-search{max-width:260px;padding:8px 12px!important;border-radius:99px!important;font-size:12.5px!important;background:#fff!important}
.lux-done-btn{padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--gold);background:#FAF5EC;color:var(--ink)}
.lux-done-btn.is-done{background:linear-gradient(145deg,#243829,#18271C);color:#FAF7F2;border-color:var(--gold)}
.lux-hours-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;margin-bottom:14px;border-radius:18px;background:linear-gradient(135deg,#1E3124,#2B4432);color:#FAF7F2;border:1px solid var(--gold)}
.lux-hours-banner b{font-family:var(--font-serif);font-size:26px;color:var(--gold)}
.lux-lesson-card{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;background:linear-gradient(180deg,#FFFFFF,#FCF9F4);border:1px solid rgba(197,165,114,.38);box-shadow:0 4px 12px rgba(30,25,20,.03)}
.lux-lesson-card.clickable{cursor:pointer;transition:.15s}
.lux-lesson-card.clickable:hover,.lux-lesson-card.clickable:active{border-color:var(--green);background:#FAF5EC}
.lux-lesson-top{display:flex;align-items:center;gap:10px;width:100%}
.lux-lesson-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;border-top:1px dashed #EFE8DC}
.lux-hw-box{margin-top:6px;padding:9px 12px;border-radius:11px;background:#F9F0DA;border:1px solid rgba(184,137,40,.38);color:#4A3508;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.lux-topic-line{margin-top:4px;font-size:13px;color:var(--ink);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.lux-link{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;margin:2px 2px;border-radius:99px;background:var(--soft);color:var(--green);border:1px solid var(--gold);font-size:11.5px;font-weight:700;text-decoration:none}
.lux-meal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.lux-meal-box{background:linear-gradient(145deg,#FFFDF9,#F7F1E5);border:1px solid rgba(197,165,114,.4);border-radius:15px;padding:11px 13px}
.lux-meal-box small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--orange);margin-bottom:3px}
.lux-meal-box strong{display:block;font-family:var(--font-serif);font-size:17px;color:var(--ink);line-height:1.25}
.lux-score-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:11px;font-size:11.5px;font-weight:700;border:1px solid rgba(197,165,114,.45);background:#FAF6EE;margin:2px 4px 2px 0}
.lux-score-pill b{font-family:var(--font-serif);font-size:15px;padding:1px 6px;border-radius:7px;background:var(--green);color:#FAF7F2}
.lux-score-pill.pf-pass b{background:var(--green);font-family:var(--font-sans);font-size:11px;padding:2px 7px}
.lux-score-pill.pf-fail b{background:var(--red);font-family:var(--font-sans);font-size:11px;padding:2px 7px}
.lux-avg-badge{display:inline-flex;align-items:center;justify-content:center;padding:5px 12px;border-radius:99px;background:linear-gradient(145deg,#243829,#18271C);color:#FAF7F2;border:1px solid var(--gold);font-family:var(--font-serif);font-size:16px;font-weight:700}
.lux-sched-table{width:100%;border-collapse:separate;border-spacing:0;min-width:600px}
.lux-sched-table th{background:#F6F0E4;color:var(--green);font-family:var(--font-serif);font-size:15px;font-weight:700;padding:9px 10px;border-bottom:1.5px solid var(--gold);border-right:1px solid #EFE8DC;text-align:center}
.lux-sched-table td{vertical-align:top;padding:7px;border-bottom:1px solid #EFE8DC;border-right:1px solid #EFE8DC;background:#FFFDF9}
.lux-cell-item{position:relative;padding:7px 22px 7px 9px;border-radius:11px;background:linear-gradient(145deg,#FAF6EE,#F3ECE0);border:1px solid rgba(197,165,114,.4);margin-bottom:5px;cursor:pointer}
.lux-cell-del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;border:1px solid rgba(158,71,64,.3);background:#FFFDF9;color:var(--red);font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}

@media(max-width:980px){
  .layout{display:block}.side{display:none}.main{padding:118px 12px 45px}
  .mobiletop{position:fixed;z-index:40;top:0;left:0;right:0;display:flex;flex-direction:column;gap:7px;padding:9px 12px;background:#FAF7F2;border-bottom:1px solid rgba(197,165,114,.38);box-shadow:0 6px 20px rgba(28,34,28,.07)}
  .mobiletop-row1{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
  .mobiletop .brand strong{font-size:17px}.mobiletop .brand small{display:none}.mobiletop .logo{width:34px;height:34px}
  .mobiletop .logout{width:auto;margin:0;padding:6px 12px;background:#F3ECE0;color:var(--green);border:1px solid var(--gold);font-weight:700}
  .g4,.g3{grid-template-columns:repeat(2,1fr)}.loginbox{grid-template-columns:1fr}.hero{border-right:0;border-bottom:1px solid var(--line)}
}
@media(max-width:720px){
  .g4,.g3,.g2,.formgrid,.lux-meal-grid{grid-template-columns:1fr}
  .lux-search{max-width:100%;width:100%}
}
@media print{.side,.mobiletop,.topright,.lux-filter-bar,.noprint{display:none!important}.layout{display:block}.main{padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>

function iso(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d=new Date()){let x=new Date(d),k=x.getDay()||7;x.setHours(12,0,0,0);x.setDate(x.getDate()-k+1);return x}
function fmt(d,o={day:'numeric',month:'long'}){return new Intl.DateTimeFormat('ru-RU',o).format(new Date(String(d).includes('T')?d:d+'T12:00:00'))}
function shortDM(dStr){const p=String(dStr||'').split('-');return p.length===3?`${p[2]}.${p[1]}`:dStr}
function week(base=new Date()){let s=monday(base),e=add(s,4);return fmt(iso(s),{day:'numeric'})+'–'+fmt(iso(e),{day:'numeric',month:'long'})}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function normNick(s=''){return String(s||'').trim().replace(/^@+/,'').toLowerCase().replace(/[^a-z0-9._-]/g,'')}
function linkify(raw=''){
  return esc(raw).replace(/(https?:\/\/[^\s<]+)/gi,u=>{
    let h='Открыть ссылку';try{h='🔗 '+new URL(u.replace(/&amp;/g,'&')).hostname.replace(/^www\./,'')}catch(e){}
    return `<a href="${u}" target="_blank" rel="noopener noreferrer" class="lux-link" onclick="event.stopPropagation()">${esc(h)} ↗</a>`;
  }).replace(/\n/g,'<br>');
}
function initials(s=''){return s.replace(/\(@.*?\)/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'У'}
function extractGrade(s){const m=String(s||'').trim().match(/^([1-4])(?![0-9])|([1-4])\s*кл/i);return m?(m[1]||m[2]):'other'}

/* Общешкольный конфиг внутри таблицы subjects (читается ВСЕМИ ролями, включая родителей!) */
function getCfg(codeKey,defVal){
  let res=JSON.parse(JSON.stringify(defVal));
  const row=db.rawSubjects.find(s=>s.code===codeKey);
  if(row&&row.name){try{res={...res,...JSON.parse(row.name)}}catch(e){}}
  return res;
}
async function saveCfg(codeKey,obj){
  const schoolId=user()?.schoolId;if(!schoolId)return;
  await sb.from('subjects').upsert({school_id:schoolId,code:codeKey,name:JSON.stringify(obj),icon:'⚙️',category:'routine',active:false},{onConflict:'school_id,code'});

}

function teacherName(tid){
  const p=prof(tid);

function isNonCounted(sObj){
  const code=sObj?.code||'',name=String(sObj?.name||'').trim();
  return ['circle','breakfast','break','lunch','snack'].includes(code)||/^(круг|завтрак|перемена|обед|полдник)$/i.test(name);
}
function isEnglish(sObj){
  const code=String(sObj?.code||'').toLowerCase(),name=String(sObj?.name||'').toLowerCase();
  return code==='eng'||code==='native_eng'||/английск|english/i.test(name);
}
function getTabelMode(sObj){
  if(!sObj)return null;
  if(isEnglish(sObj))return 'eng_free';
  const code=String(sObj.code||'').toLowerCase(),name=String(sObj.name||'').trim().toLowerCase();
  if(['rus','math','reading','literature','world'].includes(code)||/^(русский язык|математика|чтение|литература|окружающий мир)$/i.test(name))return 'score100';

  return null;
}

async function ensureSubjects(){
 const schoolId=user().schoolId;
 for(const s of subjectsDefault){
   if(db.subjects.some(x=>x.code===s.code))continue;

   await sb.from('subjects').upsert({school_id:schoolId,code:s.code,name:s.name,icon:s.icon,category,active:true},{onConflict:'school_id,code',ignoreDuplicates:true});
 }
}

/* Помощники расписания, часов (1 урок = 1 час, Круг = 0 ч) и ДЗ */
function subFor(scheduleId,date){return db.substitutions.find(x=>x.scheduleId===scheduleId&&x.date===date)}
function effectiveTeacherId(scheduleId,date=iso()){let l=db.schedule.find(x=>x.id===scheduleId),r=subFor(scheduleId,date);return r?.substituteTeacherId||l?.teacherId}
function groupName(id){return db.groups.find(g=>g.id===id)?.name||'Группа'}
function targetName(l){return l.audienceType==='school'?'Вся школа':l.audienceType==='aftercare'?'Продлёнка':l.audienceType==='group'?groupName(l.groupId):(cls(l.classId)?.name||'Класс')}
function childrenForLesson(l){
  if(!l)return [];
  if(l.audienceType==='school')return db.children.filter(k=>k.active);
  if(l.audienceType==='aftercare')return db.children.filter(k=>k.active&&k.aftercareActive);
  if(l.audienceType==='group'||l.groupId)return db.children.filter(k=>k.active&&db.childGroups.some(x=>x.child_id===k.id&&x.group_id===l.groupId));
  return db.children.filter(k=>k.classId===l.classId&&k.active);
}
function isLessonDone(scheduleId,dStr){
  return db.lessonRecords.some(r=>r.scheduleId===scheduleId&&r.date===dStr)||
         db.attendance.some(a=>a.scheduleId===scheduleId&&a.date===dStr)||
         db.observations.some(o=>o.tags[0]==='__HW__'&&o.tags[1]===scheduleId&&o.date===dStr);
}
function workedHours(teacherId,start=iso(monday()),end=iso(add(monday(),4))){
  let h=0, cur=new Date(start+'T12:00:00'), last=new Date(end+'T12:00:00');
  while(cur<=last){
    const dStr=iso(cur), wd=cur.getDay();
    if(wd>=1&&wd<=5){
      db.schedule.filter(l=>l.active&&l.weekday===wd&&effectiveTeacherId(l.id,dStr)===teacherId).forEach(l=>{
        if(!isNonCounted(sub(l.subjectId))&&isLessonDone(l.id,dStr))h+=1;
      });
    }
    cur.setDate(cur.getDate()+1);
  }
  return h;
}

/* Получение Темы и Домашнего задания (работает и у учителя, и у родителя в обход RLS!) */
function getLessonTopicAndHw(l,dStr,childId=null){
  let topic='',hw='';
  const mon=iso(monday(new Date(dStr+'T12:00:00'))), sun=iso(add(new Date(mon+'T12:00:00'),6));
  const rec=db.lessonRecords.find(r=>r.scheduleId===l.id&&r.date===dStr)||
            db.lessonRecords.find(r=>r.scheduleId===l.id&&r.date>=mon&&r.date<=sun&&((r.topic&&r.topic!=='Урок проведён')||(r.note&&!r.note.startsWith('Подтверждено'))));
  if(rec){
    if(rec.topic&&rec.topic!=='Урок проведён')topic=rec.topic;
    if(rec.note&&!rec.note.startsWith('Подтверждено'))hw=rec.note;
  }
  if(!topic&&!hw){
    const hwObs=db.observations.find(o=>o.tags[0]==='__HW__'&&o.tags[1]===l.id&&o.date===dStr&&(!childId||o.childId===childId))||
                db.observations.find(o=>o.tags[0]==='__HW__'&&o.tags[1]===l.id&&o.date>=mon&&o.date<=sun&&(!childId||o.childId===childId));
    if(hwObs){topic=hwObs.tags[2]||'';hw=hwObs.tags[3]||hwObs.text||'';}
  }
  if(!topic&&!hw){
    const hwCache=getCfg('__lc_hw_cache__',{});
    const entry=hwCache[`${l.id}_${dStr}`]||hwCache[`${l.id}_latest`];
    if(entry){topic=entry.topic||'';hw=entry.hw||'';}
  }
  return {topic,hw};
}
function isSystemObs(o){return ['__TABEL__','__TABEL_FREE__','__TABEL_PF__','__TABEL_DELETED__','__HW__','__MENU__','__PARENT_AUTH__'].includes(o.tags?.[0])}

function parseScoreObs(o){
  const t=o.tags||[];
  if(!['__TABEL__','__TABEL_FREE__','__TABEL_PF__'].includes(t[0]))return null;
  const q=['q1','q2','q3','q4'].includes(t[3])?t[3]:'q2';
  if(t[0]==='__TABEL_PF__')return {id:o.id,kind:'pf',quarter:q,childId:o.childId,subjectId:o.subjectId,date:o.date,type:t[1]||'Зачёт',status:t[2]==='fail'?'fail':'pass',topic:o.text||''};
  const raw=String(t[2]||'0').trim();
  const m=raw.match(/(\d+(?:[.,]\d+)?)\s*(?:\/|из)\s*(\d+(?:[.,]\d+)?)/i);
  if(t[0]==='__TABEL_FREE__'||m){
    const sc=m?Number(m[1].replace(',','.')):null, mx=m?Number(m[2].replace(',','.')):null;
    return {id:o.id,kind:'score',isFree:true,quarter:q,childId:o.childId,subjectId:o.subjectId,date:o.date,type:t[1]||'Проверочная',score:sc,max:mx,badge:m?`${m[1]}/${m[2]}`:raw,topic:o.text||''};
  }
  const sc=Number(raw)||0;
  return {id:o.id,kind:'score',isFree:false,quarter:q,childId:o.childId,subjectId:o.subjectId,date:o.date,type:t[1]||'Проверочная',score:sc,max:100,badge:`${sc}/100`,topic:o.text||''};
}

  return top('🔐 Смена пароля','Управление паролем вашего личного кабинета')+`<div class="card" style="max-width:520px"><form onsubmit="saveMyPassword(event)"><div class="field"><label>Новый пароль (минимум 6 символов)</label><input type="password" name="p1" minlength="6" required placeholder="Введите новый пароль"></div><div class="field"><label>Повторите новый пароль</label><input type="password" name="p2" minlength="6" required placeholder="Повторите новый пароль"></div><div class="actions"><button class="btn primary wide">✓ Сохранить новый пароль</button></div></form></div>`;
}
window.saveMyPassword=async e=>{
  e.preventDefault();const f=new FormData(e.target),p1=f.get('p1').trim(),p2=f.get('p2').trim();
  if(p1!==p2)return toast('Пароли не совпадают');
  const {error}=await sb.auth.updateUser({password:p1});
  if(error)return toast('Ошибка: '+error.message);
  e.target.reset();toast('✓ Пароль успешно изменён!');
};
window.forgotPassModal=()=>{
  modal('Забыли пароль?',`<p style="margin:0 0 12px;color:var(--muted);font-size:13px">Введите ваш логин или ник. Администратор получит уведомление и сбросит пароль на стартовый код <b>000000</b>.</p><form onsubmit=" {event.preventDefault();toast('Запрос отправлен администратору!');closeModal();}"><div class="field"><label>Ваш логин / ник</label><input required placeholder="@mama_anna"></div><div class="actions"><button class="btn primary">Отправить запрос</button></div></form>`);
};

  return `<div class="row"><span class="avatar">${initials(kid(o.childId)?.name)}</span><div class="rowmain"><strong>${esc(kid(o.childId)?.name||'')} · ${esc(cls(kid(o.childId)?.classId)?.name||'')} кл. · ${esc(sub(o.subjectId).name)}</strong><div style="font-size:13px;margin-top:4px;white-space:pre-wrap">${linkify(o.text)}</div><small>${fmt(o.date,{day:'numeric',month:'short'})} · ${esc(teacherName(o.teacherId))}</small></div>${canEdit?`<button class="btn soft" onclick="editObsModal('${o.id}')">✎ Изменить</button>`:''}</div>`;
}

function pageAdminObs(){
  const list=normalObservations().filter(o=>{
    const k=kid(o.childId);if(!k||!k.active)return false;
    if(state.obsClass!=='all'&&k.classId!==state.obsClass)return false;
    if(state.obsSubj!=='all'&&o.subjectId!==state.obsSubj)return false;
    if(state.obsChild!=='all'&&o.childId!==state.obsChild)return false;

    return true;

  return top('✎ Наблюдения (Сводка по школе)','Фильтруйте по классу, предмету или ученику','<button class="btn primary" onclick="noteModal()">+ Наблюдение</button>')+
  `<div class="lux-filter-bar" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">

function adSchedule(){
  const cols=db.classes.filter(c=>c.active).map(c=>c.name).sort((a,b)=>extractGrade(a).localeCompare(extractGrade(b))||a.localeCompare(b,'ru'));
  const grpCols=db.groups.filter(g=>g.active).map(g=>g.name);
  const allCols=[...cols,...grpCols];
  const dayTabs=[['all','Все дни'],...[1,2,3,4,5].map(d=>[String(d),days[d]])];
  const mon=monday(new Date(state.selDate+'T12:00:00'));

  let tablesHtml=[1,2,3,4,5].filter(d=>state.schedDay==='all'||state.schedDay===String(d)).map(d=>{
    const dStr=iso(add(mon,d-1));
    const ls=db.schedule.filter(x=>x.weekday===d&&x.active).sort((a,b)=>a.start.localeCompare(b.start));
    const slots=[...new Set(ls.map(l=>`${l.start}–${l.end}`))].sort();
    let lNum=0;
    const rows=slots.map(slot=>{
      const slotLs=ls.filter(l=>`${l.start}–${l.end}`===slot);
      const isRout=slotLs.every(l=>isNonCounted(sub(l.subjectId)));
      if(!isRout)lNum++;
      const badge=isRout?`<span class="chip">Режим</span>`:`<span class="chip green">${lNum} ур.</span>`;
      const tds=allCols.map(cName=>{
        const cellLs=slotLs.filter(l=>targetName(l)===cName||l.audienceType==='school');
        if(!cellLs.length)return `<td></td>`;
        return `<td>${cellLs.map(l=>`<div class="lux-cell-item" onclick="scheduleModal('${l.id}')"><strong>${sub(l.subjectId).icon} ${esc(sub(l.subjectId).name)}</strong><small>${esc(teacherName(l.teacherId))}</small><button type="button" class="lux-cell-del" onclick="archiveSchedule('${l.id}',event)">×</button></div>`).join('')}</td>`;
      }).join('');
      return `<tr><td style="white-space:nowrap">${badge}<br><b>${slot}</b></td>${tds}</tr>`;
    }).join('');
    return `<div class="card" style="margin-bottom:16px"><div class="sh"><div><h2>${days[d]} · ${fmt(dStr)}</h2></div></div><div class="table"><table class="lux-sched-table"><thead><tr><th>Время</th>${allCols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="10">Занятий нет</td></tr>'}</tbody></table></div></div>`;
  }).join('');

  return top('Расписание школы','Таблица по классам и группам','<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="scheduleModal()">+ Занятие</button><button class="btn soft" onclick="substitutionModal()">+ Замена</button></div>')+
  `<div class="lux-filter-bar"><div class="lux-grade-pills">${dayTabs.map(([k,l])=>`<button type="button" class="lux-gpill ${state.schedDay===k?'on':''}" onclick="setSchedDay('${k}')">${l}</button>`).join('')}</div></div>`+tablesHtml;
}
window.setSchedDay=d=>{state.schedDay=d;render()};

/* ==================== ПЕДАГОГ (РОВНЫЕ КАРТОЧКИ БЕЗ ПЕРЕНОСА ПО БУКВАМ) ==================== */
function renderTeacherLessonCard(l,dStr,lNum){
  const sObj=sub(l.subjectId), nonC=isNonCounted(sObj), done=isLessonDone(l.id,dStr);
  const {topic,hw}=getLessonTopicAndHw(l,dStr);
  const doneBtn=nonC
    ?`<span class="chip">Круг / Режим · без часов</span>`
    :`<button type="button" class="lux-done-btn ${done?'is-done':''}" onclick="toggleDone('${l.id}','${dStr}')">${done?`✓ Проведён ${shortDM(dStr)} (1 ч)`:`○ Отметить за ${shortDM(dStr)} (+1 ч)`}</button>`;
  return `<div class="lux-lesson-card">
    <div class="lux-lesson-top">
      <span class="time">${nonC?'Режим':lNum+' ур.'}<br>${l.start}–${l.end}</span>
      <span class="ico">${sObj.icon}</span>
      <div class="rowmain">
        <strong>${esc(targetName(l))} · ${esc(sObj.name)}</strong>
        <small>${childrenForLesson(l).length} учеников · Дата: <b>${fmt(dStr)}</b></small>
      </div>
    </div>
    ${topic?`<div class="lux-topic-line"><b>Тема урока:</b> ${linkify(topic)}</div>`:''}
    ${hw?`<div class="lux-hw-box"><b>📌 Домашнее задание:</b>\n${linkify(hw)}</div>`:''}
    <div class="lux-lesson-meta">
      ${doneBtn}
      <button type="button" class="btn primary" onclick="openAttModal('${l.id}','${dStr}')">👥 Был / Опоздал</button>
      <button type="button" class="btn soft" onclick="lessonTopicModal('${l.id}','${dStr}')">✎ Тема и ДЗ</button>
      <button type="button" class="btn ghost" onclick="noteModal('${l.id}')">+ Заметка</button>
    </div>
  </div>`;
}

function tToday(){
  const u=user(), dStr=state.selDate||iso(), wd=new Date(dStr+'T12:00:00').getDay();
  const ls=db.schedule.filter(x=>x.active&&x.weekday===wd&&effectiveTeacherId(x.id,dStr)===u.id).sort((a,b)=>a.start.localeCompare(b.start));
  let lNum=0, doneH=0, planH=0;
  ls.forEach(l=>{if(!isNonCounted(sub(l.subjectId))){planH++;if(isLessonDone(l.id,dStr))doneH++;}});
  return top('Сегодня у педагога',`${days[wd]}, ${fmt(dStr,{day:'numeric',month:'long',year:'numeric'})}`)+
  `<div class="lux-filter-bar"><div class="lux-grade-pills"><button type="button" class="btn ghost" onclick="setSelDate('${iso(add(new Date(dStr+'T12:00:00'),-1))}')">← Пред. день</button><input type="date" value="${dStr}" style="width:auto;padding:7px 12px;font-weight:700" onchange="setSelDate(this.value)"><button type="button" class="btn ghost" onclick="setSelDate('${iso(add(new Date(dStr+'T12:00:00'),1))}')">След. день →</button>${dStr!==iso()?`<button type="button" class="btn soft" onclick="setSelDate('${iso()}')">Сегодня</button>`:''}</div><span class="badge">Подтверждено: ${doneH} из ${planH} ч</span></div>`+
  (ls.length?`<div class="list">${ls.map(l=>{if(!isNonCounted(sub(l.subjectId)))lNum++;return renderTeacherLessonCard(l,dStr,lNum)}).join('')}</div>`:`<div class="empty">На ${days[wd]} (${fmt(dStr)}) занятий по расписанию нет.</div>`);
}
window.setSelDate=d=>{state.selDate=d;render()};

function tSchedule(){
  const u=user(), mon=monday(new Date(state.selDate+'T12:00:00')), fri=add(mon,4);
  const weekH=workedHours(u.id,iso(mon),iso(fri));
  const dayBlocks=[1,2,3,4,5].filter(d=>state.schedDay==='all'||state.schedDay===String(d)).map(d=>{
    const dStr=iso(add(mon,d-1));
    const ls=db.schedule.filter(x=>x.active&&x.weekday===d&&effectiveTeacherId(x.id,dStr)===u.id).sort((a,b)=>a.start.localeCompare(b.start));
    if(!ls.length)return '';
    let lNum=0;
    return `<div class="card" style="margin-bottom:16px"><div class="sh"><div><h2>${days[d]}, ${fmt(dStr)}</h2></div><span class="chip green">${ls.length} зан.</span></div><div class="list">${ls.map(l=>{if(!isNonCounted(sub(l.subjectId)))lNum++;return renderTeacherLessonCard(l,dStr,lNum)}).join('')}</div></div>`;

  return top('Моё расписание','Неделя '+week(mon))+

function parentKids(){let u=user();return db.parentLinks.filter(x=>x.parent_id===u.id).map(x=>kid(x.child_id)).filter(k=>k&&k.active)}
function pk(){let kids=parentKids(),sel=sessionStorage.getItem('PARENT_CHILD'),k=kids.find(x=>x.id===sel)||kids[0]||null;if(k&&sel!==k.id)sessionStorage.setItem('PARENT_CHILD',k.id);return k}
window.selectParentChild=id=>{sessionStorage.setItem('PARENT_CHILD',id);render()};
function parentSwitcher(){let kids=parentKids();if(kids.length<=1)return '';let k=pk();return `<div class="card" style="margin-bottom:14px"><div class="chips">${kids.map(x=>`<button class="btn ${x.id===k.id?'primary':'soft'}" onclick="selectParentChild('${x.id}')">👤 ${esc(x.first)}</button>`).join('')}</div></div>`}

function childLessonsForDay(k,wd){
  const myGroups=new Set(db.childGroups.filter(x=>x.child_id===k.id).map(x=>x.group_id));
  const raw=db.schedule.filter(l=>{
    if(!l.active||l.weekday!==wd)return false;
    if(l.audienceType==='group'||l.groupId)return myGroups.has(l.groupId);
    if(l.audienceType==='school')return true;
    if(l.audienceType==='aftercare')return k.aftercareActive;
    return l.classId===k.classId;
  }).sort((a,b)=>a.start.localeCompare(b.start));
  const byTime=new Map();
  raw.forEach(l=>{if(!byTime.has(l.start)||myGroups.has(l.groupId))byTime.set(l.start,l)});
  return [...byTime.values()];
}

window.saveLessonTopic=async e=>{
  e.preventDefault();let f=new FormData(e.target),sid=f.get('sid'),date=f.get('date2'),topic=f.get('topic').trim(),note=f.get('note').trim();
  let l=db.schedule.find(x=>x.id===sid);
  let existing=db.lessonRecords.find(x=>x.scheduleId===sid&&x.date===date);
  let res=existing?await sb.from('lesson_records').update({topic,note,updated_at:new Date().toISOString()}).eq('id',existing.id):await sb.from('lesson_records').insert({school_id:user().schoolId,schedule_id:sid,lesson_date:date,teacher_id:user().id,topic,note});
  if(res.error)return toast('Ошибка: '+res.error.message);

  /* Дублируем ДЗ и тему в карточки детей (observations с тегом __HW__), чтобы родители 100% видели их сразу! */
  const kids=childrenForLesson(l);
  const oldHw=db.observations.filter(o=>o.tags[0]==='__HW__'&&o.tags[1]===sid&&o.date===date);
  if(oldHw.length)await sb.from('observations').delete().in('id',oldHw.map(x=>x.id));
  if(kids.length){
    await sb.from('observations').insert(kids.map(k=>({school_id:user().schoolId,child_id:k.id,subject_id:l.subjectId,schedule_id:sid,teacher_id:user().id,observed_on:date,note,tags:['__HW__',sid,topic,note]})));
    await sb.from('attendance').upsert(kids.map(k=>({school_id:user().schoolId,child_id:k.id,schedule_id:sid,lesson_date:date,status:'present',marked_by:user().id})),{onConflict:'child_id,schedule_id,lesson_date',ignoreDuplicates:true});
  }
  closeModal();await refresh();toast('Тема и ДЗ отправлены родителям!');
};

  let k=kid(kidId);if(!k)return;let start=iso(monday()),end=iso(add(monday(),4)),f=db.feedbackReports.find(x=>x.childId===kidId&&x.start===start&&x.end===end);
  if(!f){let {data}=await sb.from('feedback_reports').insert({school_id:user().schoolId,child_id:kidId,period_start:start,period_end:end,teacher_id:user().id,overall_comment:'',status:'draft'}).select().single();await loadDb();f=db.feedbackReports.find(x=>x.id===data.id);}
  modal('Итог недели · '+k.name,`<form onsubmit="saveFeedback(event)"><input type="hidden" name="fid" value="${f.id}"><div class="field"><label>Общий комментарий наставника за неделю</label><textarea name="overall" style="min-height:130px">${esc(f.overall||'')}</textarea></div><div class="actions"><button type="submit" name="act" value="draft" class="btn soft">Сохранить черновик</button><button type="submit" name="act" value="pub" class="btn primary">Опубликовать для родителя</button></div></form>`);
};
window.saveFeedback=async e=>{e.preventDefault();let f=new FormData(e.target),pub=e.submitter?.value==='pub';await sb.from('feedback_reports').update({overall_comment:f.get('overall'),status:pub?'published':'draft',published_at:pub?new Date().toISOString():null}).eq('id',f.get('fid'));closeModal();await refresh();toast(pub?'Опубликовано':'Черновик сохранён')};
window.feedbackPdf=(kidId,fid)=>{let k=kid(kidId),f=db.feedbackReports.find(x=>x.id===fid);if(!k||!f)return;let w=window.open('','_blank');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(k.name)}</title><style>body{font-family:Georgia,serif;padding:24px}</style></head><body><h1>Little Clan · ${esc(k.name)}</h1><p>${esc(f.overall).replace(/\n/g,'<br>')}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()};

window.doLogin=async e=>{
  e.preventDefault();
  let raw=document.getElementById('email').value.trim(), pass=document.getElementById('pass').value;
  let nick=normNick(raw), mail=raw.includes('@')&&!raw.startsWith('@')?raw.toLowerCase():(nick+'@littleclan.local');
  let {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass});
  if(error)return toast('Неверный логин или пароль');
  session={userId:data.user.id};sessionStorage.setItem(SESSION,JSON.stringify(session));
  await loadDb();route=def(user().role);render();
};
window.logout=async()=>{await sb.auth.signOut();session=null;route=null;sessionStorage.removeItem(SESSION);render()};
window.go=r=>{route=r;render();window.scrollTo({top:0,behavior:'smooth'})};

async function boot(){
  const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  sb=mod.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  authSb=mod.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const {data:{session:s}}=await sb.auth.getSession();
  if(s){session={userId:s.user.id};try{await loadDb();route=def(user().role)}catch(e){await sb.auth.signOut();session=null}}
  render();
}
boot();
})();
</script>
